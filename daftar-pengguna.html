</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIXZY - Daftar Pengguna</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer;font-size:11px}
.btn-dark{background:#0f172a;color:#fff} .btn-white{background:#fff;border:1px solid #e2e8f0} .btn-red{background:#ef4444;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;border:1px solid #e2e8f0}
.stat small{display:block;font-size:10px;color:#64748b;font-weight:800;text-transform:uppercase} .stat b{font-size:18px;display:block;margin-top:2px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;width:100%}
.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:700px;font-size:11px}
th{background:#0f172a;color:#fff;padding:9px 8px;text-align:left;font-size:10px;text-transform:uppercase;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.badge{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}
.badge.ok{background:#dcfce7;color:#15803d} .badge.off{background:#fee2e2;color:#991b1b} .badge.wait{background:#fef9c3;color:#854d0e}
#loginBox{max-width:380px;margin:60px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 30px #0002}
</style></head><body>
<div id="loginBox"><h2 style="margin:0 0 8px">🔒 Login Owner</h2><input id="email" value="servicehpmaja@gmail.com" style="width:100%;margin-bottom:8px"><input id="pass" type="password" placeholder="Password" style="width:100%;margin-bottom:8px"><button class="btn btn-dark" style="width:100%" onclick="loginOwner()">Masuk</button><div id="loginErr" style="color:#dc2626;font-size:11px;margin-top:8px;display:none"></div></div>
<div id="app" style="display:none">
<div class="top"><div><h1 style="margin:0;font-size:14px">👑 FIXZY - DAFTAR PENGGUNA / OWNER</h1><small id="ownerEmail" style="color:#94a3b8"></small></div><div style="display:flex;gap:6px"><a href="index.html" style="text-decoration:none"><button class="btn btn-white">🎫 Token</button></a><button class="btn btn-white" onclick="loadUsers()">↻ Refresh</button><button class="btn btn-red" onclick="logout()">Logout</button></div></div>
<div class="wrap">
<div class="stats"><div class="stat"><small>Total Owner</small><b id="stTotal">0</b></div><div class="stat" style="background:#f0fdf4;border-color:#bbf7d0"><small>Aktif</small><b id="stAktif" style="color:#15803d">0</b></div><div class="stat" style="background:#fffbeb;border-color:#fde68a"><small>Akan Exp <7 hari</small><b id="stSoon" style="color:#b45309">0</b></div><div class="stat" style="background:#fef2f2;border-color:#fecaca"><small>Expired</small><b id="stExp" style="color:#991b1b">0</b></div></div>
<div class="card"><h3 style="margin:0 0 10px">🔍 Cari Pengguna</h3><div style="display:grid;grid-template-columns:1fr 1fr 120px;gap:6px"><input id="cariNama" placeholder="Cari nama konter..." oninput="render()"><input id="cariEmail" placeholder="Cari email..." oninput="render()"><select id="filterStatus" onchange="render()"><option value="">Semua Status</option><option value="aktif">Aktif</option><option value="soon">Akan Habis</option><option value="expired">Expired</option></select></div></div>
<div class="card"><h3>📋 Daftar Owner Terdaftar</h3><div class="table-wrap"><table><thead><tr><th>KONTER</th><th>EMAIL</th><th>AKTIF SAMPAI</th><th>SISA</th><th>STATUS</th><th>PAKET TERAKHIR</th></tr></thead><tbody id="userBody"><tr><td colspan=6 style="text-align:center;padding:20px">Memuat...</td></tr></tbody></table></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
let allUsers=[];
function parseExp(o){ let cands=[o.exp,o.expAt,o.expiredAt,o.aktifSampai,o.tanggalBerakhir,o.activeUntil]; for(let k in o){ let lk=k.toLowerCase(); if(lk.includes('exp')||lk.includes('akhir')||lk.includes('sampai')) cands.push(o[k]); } for(let c of cands){ if(!c) continue; try{ if(c.toDate) return c.toDate(); if(c.seconds) return new Date(c.seconds*1000); let d=new Date(c); if(!isNaN(d)&&d.getFullYear()>2020) return d; }catch(e){} } return null; }
window.loginOwner=async function(){ const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value.trim(); const err=document.getElementById('loginErr'); err.style.display='none'; if(!e||!p){ err.style.display='block'; err.textContent='Isi email & password'; return; } try{ await signInWithEmailAndPassword(auth,e,p); }catch(ex){ err.style.display='block'; err.textContent='Gagal: '+ex.message; } }
window.logout=async function(){ await signOut(auth); location.reload(); }
onAuthStateChanged(auth,(u)=>{ if(!u){ document.getElementById('loginBox').style.display='block'; document.getElementById('app').style.display='none'; return; } document.getElementById('loginBox').style.display='none'; document.getElementById('app').style.display='block'; document.getElementById('ownerEmail').textContent=u.email; loadUsers(); });
window.loadUsers=async function(){
  document.getElementById('userBody').innerHTML='<tr><td colspan=6 style="text-align:center;padding:20px">Memuat ulang...</td></tr>';
  try{
    const snap=await getDocs(collection(db,"users"));
    let users=[]; snap.forEach(d=>users.push({id:d.id,...d.data()}));
    users=users.filter(u=>{ const r=(u.role||'').toLowerCase(); return r!=='employee' && r!=='karyawan'; });
    allUsers=users.map(u=>{ const e=parseExp(u); const sisa=e?Math.ceil((e-new Date())/86400000):-999; return {...u, _exp:e, _sisa:sisa}; });
    allUsers.sort((a,b)=>{ const da=a._exp? a._exp.getTime():0; const db=b._exp? b._exp.getTime():0; return db-da; });
    render();
  }catch(e){ document.getElementById('userBody').innerHTML='<tr><td colspan=6 style="color:red">Error: '+e.message+'</td></tr>'; }
}
window.render=function(){
  const qNama=(document.getElementById('cariNama').value||'').toLowerCase().trim();
  const qEmail=(document.getElementById('cariEmail').value||'').toLowerCase().trim();
  const fStatus=document.getElementById('filterStatus').value;
  let filtered=allUsers.filter(u=>{
    const nama=(u.namaKonter||u.nama||'').toLowerCase();
    const email=(u.email||'').toLowerCase();
    if(qNama && !nama.includes(qNama)) return false;
    if(qEmail && !email.includes(qEmail)) return false;
    if(fStatus==='aktif' && u._sisa<=7) return false;
    if(fStatus==='soon' && (u._sisa<=0 || u._sisa>7)) return false;
    if(fStatus==='expired' && u._sisa>0) return false;
    return true;
  });
  let total=filtered.length, aktif=filtered.filter(u=>u._sisa>7).length, soon=filtered.filter(u=>u._sisa>0 && u._sisa<=7).length, exp=filtered.filter(u=>u._sisa<=0).length;
  document.getElementById('stTotal').textContent=allUsers.length;
  document.getElementById('stAktif').textContent=allUsers.filter(u=>u._sisa>7).length;
  document.getElementById('stSoon').textContent=allUsers.filter(u=>u._sisa>0 && u._sisa<=7).length;
  document.getElementById('stExp').textContent=allUsers.filter(u=>u._sisa<=0).length;
  let html="";
  filtered.forEach(u=>{
    const tgl=u._exp? u._exp.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'}):'-';
    const sisaTxt=u._sisa>0? u._sisa+' hari' : (u._sisa===0?'hari ini':'expired');
    const badge=u._sisa>7?'<span class=badge ok>Aktif</span>':(u._sisa>0?'<span class=badge wait>Akan Habis</span>':'<span class=badge off>Expired</span>');
    const paket=u.paketTerakhir||u.paket||u.lastPaket||'-';
    html+=`<tr><td><b>${u.namaKonter||u.nama||'-'}</b></td><td>${u.email||'-'}</td><td>${tgl}</td><td>${sisaTxt}</td><td>${badge}</td><td>${paket}</td></tr>`;
  });
  document.getElementById('userBody').innerHTML=html||'<tr><td colspan=6 style="text-align:center;padding:20px">Tidak ada pengguna</td></tr>';
}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
