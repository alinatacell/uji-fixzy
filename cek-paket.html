<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Cek Aktivasi</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#111827}
.top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.btn-y{background:#ffc107;color:#111827}.btn-r{background:#dc2626;color:#fff}
.wrap{max-width:560px;margin:auto;padding:14px}
.card{background:#111827;color:#fff;border-radius:20px;padding:18px;margin-bottom:14px}
.card.white{background:#fff;color:#111827;border:1px solid #e5e7eb;box-shadow:0 4px 15px #0001}
.label{font-size:11px;color:#64748b;font-weight:800;margin-bottom:4px}
.val{font-size:20px;font-weight:900}
.input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;text-transform:uppercase;letter-spacing:2px;font-weight:900}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.yellow{background:#fef3c7;color:#92400e}
.small-info{font-size:11px;color:#64748b;margin-top:7px}
</style>
</head>
<body>

<div class="top">
  <div style="flex:1">
    <h1 style="margin:0;font-size:22px">FIXZY - Cek Aktivasi</h1>
    <p style="margin:4px 0 0;font-size:12px;opacity:.8">Cek dan perpanjang masa aktif akun</p>
  </div>
  <button class="btn btn-y" onclick="loadData()">&#8635;</button>
  <button class="btn btn-r" onclick="tutupHalaman()">X</button>
</div>

<div class="wrap">

  <!-- FUNGSI 1: CEK AKTIVASI -->
  <div class="card">
    <div style="font-size:22px;font-weight:900;margin-bottom:10px">🔐 Aktivasi Akun</div>

    <div style="display:grid;gap:10px">
      <div style="background:#fff;color:#111827;border-radius:14px;padding:12px">
        <div class="label">Nama Konter</div>
        <div class="val" id="namaKonter">-</div>
      </div>

      <div style="background:#fff;color:#111827;border-radius:14px;padding:12px">
        <div class="label">Aktif Sampai</div>
        <div class="val" id="aktifSampai">-</div>
        <div id="sisaHari" style="margin-top:6px"></div>
        <div id="sumberAktivasi" class="small-info"></div>
      </div>
    </div>
  </div>

  <!-- FUNGSI 2: PERPANJANGAN -->
  <div class="card white">
    <h3 style="margin:0 0 8px">Perpanjang Aktivasi Pakai Token</h3>
    <p style="font-size:12px;color:#64748b;margin:0 0 10px">
      Masukkan token perpanjangan yang dibeli dari Owner.
      Masa aktif akan <b>ditambahkan</b> dari tanggal aktif yang sekarang.
    </p>

    <input id="tokenInput" class="input" placeholder="AB12-9F3K-Q7WZ" maxlength="50" autocomplete="off">

    <button id="btnPakaiToken" class="btn btn-y"
      style="width:100%;margin-top:10px;padding:14px;font-size:16px"
      onclick="pakaiToken()">Aktifkan Token</button>

    <div id="tokenMsg" style="margin-top:10px;font-size:12px;font-weight:800;white-space:pre-line"></div>
  </div>

</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=getApps().length ? getApp() : initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUid=null;
let currentUserData=null;
let authReady=false;

window.tutupHalaman=function(){
  try{
    if(parent!==window){
      parent.postMessage({type:"FIXZY_CLOSE_PAGE"},"*");
      return;
    }
  }catch(e){}
  location.href="index.html";
};

/* =========================================================
   NORMALISASI TANGGAL
   Prioritas:
   1. tanggalBerakhir  -> akun registrasi token / sistem baru
   2. exp               -> Free Trial / sistem lama
   3. expAt             -> kompatibilitas
   4. expiredAt         -> kompatibilitas
   ========================================================= */
function parseDateValue(v){
  if(v===undefined || v===null || v==="") return null;

  try{
    if(typeof v==="object" && typeof v.toDate==="function"){
      const d=v.toDate();
      return isNaN(d.getTime()) ? null : d;
    }

    if(typeof v==="object" && v.seconds!==undefined){
      const d=new Date(Number(v.seconds)*1000);
      return isNaN(d.getTime()) ? null : d;
    }

    if(v instanceof Date){
      return isNaN(v.getTime()) ? null : v;
    }

    const d=new Date(v);
    return isNaN(d.getTime()) ? null : d;
  }catch(e){
    return null;
  }
}

function getExpirationFromUser(data){
  if(!data) return null;

  /*
    PENTING:
    tanggalBerakhir adalah sumber utama untuk akun hasil
    registrasi token 90 hari.
  */
  const candidates=[
    ["tanggalBerakhir",data.tanggalBerakhir],
    ["exp",data.exp],
    ["expAt",data.expAt],
    ["expiredAt",data.expiredAt]
  ];

  for(const [field,value] of candidates){
    const d=parseDateValue(value);
    if(d) return {date:d,field};
  }

  return null;
}

function formatTanggal(d){
  return d.toLocaleDateString("id-ID",{
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function tampilkanAktivasi(data){
  const namaEl=document.getElementById("namaKonter");
  const sampaiEl=document.getElementById("aktifSampai");
  const sisaEl=document.getElementById("sisaHari");
  const sumberEl=document.getElementById("sumberAktivasi");

  const nama=
    data?.namaKonter ||
    data?.namaToko ||
    data?.tokoName ||
    data?.nama ||
    data?.name ||
    "Akun Fixzy";

  namaEl.textContent=nama;

  const hasil=getExpirationFromUser(data);

  if(!hasil){
    sampaiEl.textContent="-";
    sisaEl.innerHTML='<span class="badge red">Masa aktif belum ditemukan</span>';
    sumberEl.textContent="Data tanggal aktivasi belum tersedia di users akun ini.";
    return;
  }

  const exp=hasil.date;
  sampaiEl.textContent=formatTanggal(exp);

  /*
    Hitung berdasarkan tanggal sekarang.
    Jam diabaikan supaya 90 hari tidak berubah menjadi 89 hanya
    karena perbedaan jam.
  */
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const expDay=new Date(exp.getFullYear(),exp.getMonth(),exp.getDate());
  const sisa=Math.ceil((expDay-today)/86400000);

  if(sisa>7){
    sisaEl.innerHTML='<span class="badge green">'+sisa+' hari lagi</span>';
  }else if(sisa>0){
    sisaEl.innerHTML='<span class="badge yellow">'+sisa+' hari lagi</span>';
  }else{
    sisaEl.innerHTML='<span class="badge red">Kadaluarsa</span>';
  }

  if(hasil.field==="tanggalBerakhir"){
    sumberEl.textContent="Sumber: tanggalBerakhir akun Firebase.";
  }else{
    sumberEl.textContent="Sumber: "+hasil.field+" (kompatibilitas akun lama / Free Trial).";
  }
}

async function ambilUserAktif(){
  if(!currentUid) return null;

  const ref=doc(db,"users",currentUid);
  const snap=await getDoc(ref);

  if(!snap.exists()) return null;

  const data=snap.data()||{};
  currentUserData=data;
  return data;
}

window.loadData=async function(){
  const namaEl=document.getElementById("namaKonter");
  const sampaiEl=document.getElementById("aktifSampai");
  const sisaEl=document.getElementById("sisaHari");
  const sumberEl=document.getElementById("sumberAktivasi");

  if(!authReady){
    namaEl.textContent="Memuat...";
    sampaiEl.textContent="-";
    return;
  }

  if(!currentUid){
    namaEl.textContent="-";
    sampaiEl.textContent="-";
    sisaEl.innerHTML='<span class="badge red">Belum login</span>';
    sumberEl.textContent="Silakan login ke akun Fixzy terlebih dahulu.";
    return;
  }

  try{
    const data=await ambilUserAktif();

    if(!data){
      namaEl.textContent="-";
      sampaiEl.textContent="-";
      sisaEl.innerHTML='<span class="badge red">Data akun tidak ditemukan</span>';
      sumberEl.textContent="UID login tidak memiliki dokumen users/{uid}.";
      return;
    }

    tampilkanAktivasi(data);
  }catch(err){
    console.error("CEK AKTIVASI:",err);
    namaEl.textContent="-";
    sampaiEl.textContent="-";
    sisaEl.innerHTML='<span class="badge red">Gagal membaca data</span>';
    sumberEl.textContent=err.message||"Firebase error";
  }
};

/* =========================================================
   AUTH
   Jangan signInAnonymously.
   Cek Aktivasi harus membaca akun Firebase yang sedang login.
   ========================================================= */
onAuthStateChanged(auth,async user=>{
  authReady=true;
  currentUid=user?.uid||null;

  if(user){
    console.log("[FIXZY AKTIVASI] Login UID:",user.uid);
  }else{
    console.log("[FIXZY AKTIVASI] Tidak ada akun login.");
  }

  await loadData();
});

/* =========================================================
   FUNGSI 2 — TOKEN PERPANJANGAN
   Token perpanjangan tetap berasal dari collection:
   "tokens"
   BUKAN registrationTokens.
   ========================================================= */
window.pakaiToken=async function(){
  const input=document.getElementById("tokenInput");
  const msg=document.getElementById("tokenMsg");
  const btn=document.getElementById("btnPakaiToken");

  const tokenStr=(input.value||"").trim().toUpperCase();

  if(!tokenStr){
    msg.textContent="Masukkan token perpanjangan.";
    msg.style.color="#dc2626";
    return;
  }

  if(!currentUid){
    msg.textContent="Akun belum terdeteksi. Silakan login ulang.";
    msg.style.color="#dc2626";
    return;
  }

  btn.disabled=true;
  msg.textContent="Memeriksa token perpanjangan...";
  msg.style.color="#2563eb";

  try{
    /*
      TOKEN PERPANJANGAN = collection "tokens"
    */
    const q=query(
      collection(db,"tokens"),
      where("token","==",tokenStr)
    );

    const snap=await getDocs(q);

    if(snap.empty){
      throw new Error("Token perpanjangan tidak ditemukan.");
    }

    let tokenDoc=null;
    let tokenInfo=null;

    for(const d of snap.docs){
      const data=d.data()||{};

      const used=
        data.used===true ||
        String(data.status||"").toLowerCase()==="terpakai" ||
        String(data.status||"").toLowerCase()==="used";

      if(!used){
        tokenDoc=d;
        tokenInfo=data;
        break;
      }
    }

    if(!tokenDoc){
      throw new Error("Token perpanjangan sudah terpakai.");
    }

    /*
      Pastikan token bukan token registrasi baru.
      Jika field tipe tidak ada, tetap kompatibel dengan token
      perpanjangan lama.
    */
    const tipe=String(tokenInfo.tipe||tokenInfo.tokenType||"").toLowerCase();

    if(
      tipe==="registrasi_baru" ||
      tipe==="aktivasi_baru" ||
      tokenInfo.hanyaRegistrasiBaru===true
    ){
      throw new Error("Token ini khusus registrasi akun baru, bukan token perpanjangan.");
    }

    /*
      Ambil akun terbaru sebelum menghitung tanggal baru.
    */
    const userRef=doc(db,"users",currentUid);
    const userSnap=await getDoc(userRef);

    if(!userSnap.exists()){
      throw new Error("Data akun tidak ditemukan di users.");
    }

    const userData=userSnap.data()||{};
    currentUserData=userData;

    /*
      Ambil tanggal aktif lama.
      Untuk akun baru:
        tanggalBerakhir
      Untuk Free Trial / akun lama:
        exp / expAt / expiredAt
    */
    const oldExpInfo=getExpirationFromUser(userData);
    const now=new Date();

    /*
      Jika masih aktif, tambah dari tanggal berakhir.
      Jika sudah kadaluarsa, mulai dari hari ini.
    */
    let baseDate=now;

    if(oldExpInfo && oldExpInfo.date>now){
      baseDate=oldExpInfo.date;
    }

    /*
      Durasi token.
      Prioritas paketHari. Jika tidak ada, coba beberapa bentuk
      lama yang mungkin digunakan.
    */
    let hari=Number(
      tokenInfo.paketHari ??
      tokenInfo.durasiHari ??
      tokenInfo.masaAktifHari ??
      0
    );

    if(!hari){
      const paketText=String(
        tokenInfo.paket ??
        tokenInfo.durasi ??
        tokenInfo.masaAktif ??
        ""
      ).toLowerCase();

      const angka=paketText.match(/\d+/);
      if(angka) hari=Number(angka[0]);

      if(paketText.includes("bulan") && hari>0){
        hari*=30;
      }
    }

    if(!hari || hari<=0){
      hari=30;
    }

    const newExp=new Date(baseDate);
    newExp.setDate(newExp.getDate()+hari);

    /*
      SIMPAN SEMUA FIELD TANGGAL PENTING.
      tanggalBerakhir = sumber utama sistem baru.
      exp/expAt = kompatibilitas Free Trial / sistem lama.
    */
    await updateDoc(userRef,{
      tanggalBerakhir:newExp.toISOString(),
      exp:newExp.toISOString(),
      expAt:newExp.toISOString(),
      expiredAt:newExp.toISOString(),

      status:"aktif",
      active:true,
      masaAktif:"aktif",

      updatedAt:serverTimestamp(),
      lastActivationUpdateAt:serverTimestamp(),

      lastActivationToken:tokenStr,
      lastActivationTokenId:tokenDoc.id,
      lastActivationDays:hari
    });

    /*
      TOKEN DITANDAI TERPAKAI.
    */
    await updateDoc(doc(db,"tokens",tokenDoc.id),{
      used:true,
      status:"terpakai",
      usedBy:currentUid,
      usedAt:serverTimestamp()
    });

    input.value="";

    msg.textContent=
      "Berhasil! Masa aktif bertambah "+hari+
      " hari.\nAktif sampai "+formatTanggal(newExp);

    msg.style.color="#16a34a";

    await loadData();

    /*
      Beri waktu agar data terlihat sebelum halaman induk
      melakukan refresh.
    */
    setTimeout(()=>{
      try{
        if(parent!==window){
          parent.location.reload();
        }
      }catch(e){}
    },800);

  }catch(err){
    console.error("PERPANJANGAN TOKEN:",err);

    let pesan=err?.message||"Gagal memperpanjang masa aktif.";

    if(err?.code==="permission-denied"){
      pesan="Firebase menolak akses. Periksa Firestore Rules untuk users dan tokens.";
    }

    msg.textContent=pesan;
    msg.style.color="#dc2626";

  }finally{
    btn.disabled=false;
  }
};

document.getElementById("tokenInput").addEventListener("input",function(){
  this.value=this.value.toUpperCase();
});
</script>

</body>
</html>
