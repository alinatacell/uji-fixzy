<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY ADMIN - TOKEN REGISTRASI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.top{background:#0f172a;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:900;cursor:pointer;font-size:11px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-yellow{background:#facc15;color:#111}
.btn-red{background:#ef4444;color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.btn-white{background:#fff;border:1px solid #e2e8f0;color:#111}
.wrap{max-width:1100px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;border:1px solid #e2e8f0}
.stat small{display:block;font-size:10px;color:#64748b;font-weight:800;text-transform:uppercase}
.stat b{font-size:20px;display:block;margin-top:2px}
.stat.yellow{background:#fffbeb;border-color:#fde68a}.stat.yellow b{color:#b45309}
.stat.blue{background:#eff6ff;border-color:#bfdbfe}.stat.blue b{color:#1d4ed8}
.stat.green{background:#f0fdf4;border-color:#bbf7d0}.stat.green b{color:#15803d}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid #e2e8f0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:900}
input,select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;width:100%;background:#fff}
input[readonly]{background:#f8fafc}
.table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;margin-top:10px}
table{width:100%;border-collapse:collapse;min-width:650px;font-size:11px}
th{background:#0f172a;color:#fff;padding:9px 8px;text-align:left;font-size:10px;text-transform:uppercase;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.badge{padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.off{background:#fee2e2;color:#991b1b}
#loginBox{max-width:380px;margin:60px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 30px #0002}
#loginBox input{margin-bottom:8px}
.msg{font-size:11px;margin-top:8px;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal.show{display:flex}
.modalBox{width:min(430px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 20px 60px #0005}
.modalBox h3{margin:0 0 8px}
.modalActions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}
@media(max-width:600px){
 .stats{grid-template-columns:1fr}
 .top{align-items:flex-start;gap:8px}
 .top .actions{display:flex;flex-direction:column}
}
</style>
</head>
<body>

<div id="loginBox">
  <h2 style="margin:0 0 8px">🔒 Login Owner</h2>
  <input id="email" value="servicehpmaja@gmail.com">
  <input id="pass" type="password" placeholder="Password">
  <button class="btn btn-dark" style="width:100%" onclick="loginOwner()">Masuk</button>
  <div id="loginErr" class="msg" style="color:#dc2626;display:none"></div>
</div>

<div id="app" style="display:none">
  <div class="top">
    <div>
      <h1 style="margin:0;font-size:14px">FIXZY ADMIN - TOKEN REGISTRASI</h1>
      <small style="color:#94a3b8" id="ownerEmail"></small>
    </div>
    <div class="actions" style="display:flex;gap:6px">
      <button class="btn btn-white" id="btnRefresh" onclick="loadAll()">↻ Refresh</button>
      <button class="btn btn-red" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="stat"><small>Total Token Registrasi</small><b id="stTotal">0</b></div>
      <div class="stat yellow"><small>Tersedia</small><b id="stSedia">0</b></div>
      <div class="stat green"><small>Terpakai</small><b id="stPakai">0</b></div>
    </div>

    <div class="card">
      <h3>🎫 Buat Token Registrasi - 3 Bulan</h3>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <label style="font-size:10px;font-weight:800">PAKET</label>
          <input value="3 Bulan / 90 Hari" readonly>
        </div>
        <div>
          <label style="font-size:10px;font-weight:800">JUMLAH TOKEN</label>
          <input id="jml" type="number" min="1" max="100" value="100">
        </div>
        <div>
          <label style="font-size:10px;font-weight:800">HARGA / TOKEN</label>
          <input value="Gratis Registrasi" readonly>
        </div>
        <div>
          <label style="font-size:10px;font-weight:800">PREFIX OPSIONAL</label>
          <input id="pref" placeholder="Kosong = random">
        </div>
      </div>

      <button id="btnBuat" class="btn btn-yellow" style="width:100%;margin-top:10px;height:46px;font-size:14px" onclick="buatTokenRegistrasi()">
        🎫 Buat Token Registrasi
      </button>
      <div id="msg" class="msg" style="color:#15803d"></div>
    </div>

    <div class="card">
      <h3>🔎 Daftar Token Registrasi</h3>

      <div style="display:grid;grid-template-columns:1fr 160px;gap:7px">
        <input id="cari" placeholder="Ketik token atau email pemakai..." oninput="renderTokens()">
        <select id="filterStatus" onchange="renderTokens()">
          <option value="">Semua</option>
          <option value="tersedia">Tersedia</option>
          <option value="terpakai">Terpakai</option>
        </select>
      </div>

      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px">
        <label style="font-size:11px;font-weight:800">
          <input type="checkbox" id="checkAll" onchange="toggleAll(this)" style="width:auto">
          Ceklis Semua
        </label>
        <span id="countInfo" style="font-size:10px;color:#64748b">0 token</span>
        <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-dark" onclick="copySelected()">📋 Salin (<span id="countSel">0</span>)</button>
          <button class="btn btn-red" onclick="deleteSelected()">🗑️ Hapus</button>
          <button class="btn btn-white" onclick="deleteUsed()">🧹 Hapus yang Terpakai</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="checkHead" onchange="document.getElementById('checkAll').checked=this.checked;toggleAll(this)" style="width:auto"></th>
              <th>Token</th>
              <th>Paket</th>
              <th>Status</th>
              <th>Pemakai</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tokenBody">
            <tr><td colspan="6" style="text-align:center;padding:20px">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalBox">
    <h3 id="modalTitle">Konfirmasi</h3>
    <div id="modalText" style="font-size:12px;color:#475569;line-height:1.5"></div>
    <div class="modalActions">
      <button class="btn btn-white" onclick="closeModal()">Batal</button>
      <button id="modalOk" class="btn btn-red">Lanjutkan</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

/*
  COLLECTION KHUSUS TOKEN REGISTRASI USER BARU.
  JANGAN dicampur dengan collection "tokens" milik perpanjangan.
*/
const TOKEN_COLLECTION="registrationTokens";

let allTokens=[];
let selected=new Set();

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function showModal(title,text,ok,callback){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  const b=document.getElementById("modalOk");
  b.textContent=ok;
  b.onclick=async()=>{ closeModal(); await callback(); };
  document.getElementById("modal").classList.add("show");
}
window.closeModal=function(){
  document.getElementById("modal").classList.remove("show");
};

window.loginOwner=async function(){
  const e=document.getElementById("email").value.trim();
  const p=document.getElementById("pass").value.trim();
  const err=document.getElementById("loginErr");
  err.style.display="none";

  if(!e||!p){
    err.textContent="Isi email dan password.";
    err.style.display="block";
    return;
  }

  try{
    await signInWithEmailAndPassword(auth,e,p);
  }catch(ex){
    err.textContent="Gagal login: "+ex.message;
    err.style.display="block";
  }
};

window.logout=async function(){
  await signOut(auth);
};

onAuthStateChanged(auth,(u)=>{
  if(!u){
    document.getElementById("loginBox").style.display="block";
    document.getElementById("app").style.display="none";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("ownerEmail").textContent=u.email||"";
  loadAll();
});

function genToken(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let t="";
  for(let i=0;i<12;i++){
    t+=chars[Math.floor(Math.random()*chars.length)];
  }
  return t.match(/.{1,4}/g).join("-");
}

async function tokenExists(token){
  // Tidak menggunakan query(). Mengikuti pola file acuan:
  // getDocs(collection(...)) lalu pemeriksaan di JavaScript.
  const snap=await getDocs(collection(db,TOKEN_COLLECTION));
  let found=false;
  snap.forEach(d=>{
    const x=d.data()||{};
    if(String(x.token||"").toUpperCase()===token.toUpperCase()) found=true;
  });
  return found;
}

window.buatTokenRegistrasi=async function(){
  const btn=document.getElementById("btnBuat");
  const msg=document.getElementById("msg");

  let jml=parseInt(document.getElementById("jml").value||"0",10);
  const pref=(document.getElementById("pref").value||"").toUpperCase().trim();

  if(!jml||jml<1){
    msg.style.color="#dc2626";
    msg.textContent="Jumlah token minimal 1.";
    return;
  }

  if(jml>100){
    msg.style.color="#dc2626";
    msg.textContent="Maksimal 100 token sekali buat.";
    return;
  }

  btn.disabled=true;
  btn.textContent="⏳ Membuat token...";
  msg.style.color="#15803d";
  msg.textContent="Menyiapkan "+jml+" token registrasi...";

  try{
    // Ambil token lama sekali saja untuk mencegah duplikat.
    const snap=await getDocs(collection(db,TOKEN_COLLECTION));
    const existing=new Set();

    snap.forEach(d=>{
      const x=d.data()||{};
      if(x.token) existing.add(String(x.token).toUpperCase());
    });

    let dibuat=0;

    for(let i=0;i<jml;i++){
      let token="";
      let percobaan=0;

      do{
        token=genToken();
        if(pref) token=pref+"-"+token;
        percobaan++;
      }while(existing.has(token.toUpperCase()) && percobaan<30);

      if(existing.has(token.toUpperCase())){
        throw new Error("Gagal membuat token unik. Coba lagi.");
      }

      existing.add(token.toUpperCase());

      await addDoc(collection(db,TOKEN_COLLECTION),{
        token,
        paket:"3 Bulan / 90 Hari",
        paketHari:90,
        tipe:"registrasi_baru",
        hanyaRegistrasiBaru:true,
        harga:0,
        used:false,
        status:"tersedia",
        usedBy:"",
        usedByEmail:"",
        usedAt:null,
        createdAt:serverTimestamp(),
        createdBy:auth.currentUser?.email||""
      });

      dibuat++;
    }

    msg.style.color="#15803d";
    msg.textContent="Berhasil membuat "+dibuat+" token registrasi 3 bulan.";
    document.getElementById("jml").value="100";
    document.getElementById("pref").value="";
    await loadAll();

  }catch(e){
    msg.style.color="#dc2626";
    msg.textContent="Gagal: "+(e?.message||e);
  }finally{
    btn.disabled=false;
    btn.textContent="🎫 Buat Token Registrasi";
  }
};

window.loadAll=async function(){
  const btn=document.getElementById("btnRefresh");
  btn.disabled=true;
  btn.textContent="⏳ Loading...";

  try{
    selected.clear();

    const snap=await getDocs(collection(db,TOKEN_COLLECTION));
    allTokens=[];

    snap.forEach(d=>{
      allTokens.push({id:d.id,...(d.data()||{})});
    });

    allTokens.sort((a,b)=>{
      const av=a.createdAt?.toDate?a.createdAt.toDate():
        (a.createdAt?.seconds?new Date(a.createdAt.seconds*1000):new Date(a.createdAt||0));
      const bv=b.createdAt?.toDate?b.createdAt.toDate():
        (b.createdAt?.seconds?new Date(b.createdAt.seconds*1000):new Date(b.createdAt||0));
      return bv-av;
    });

    renderTokens();

  }catch(e){
    document.getElementById("tokenBody").innerHTML=
      '<tr><td colspan="6" style="color:#dc2626;padding:20px">Error Firebase: '+esc(e.message)+'</td></tr>';
  }finally{
    btn.disabled=false;
    btn.textContent="↻ Refresh";
  }
};

window.renderTokens=function(){
  const q=(document.getElementById("cari").value||"").toLowerCase().trim();
  const status=document.getElementById("filterStatus").value;

  const filtered=allTokens.filter(t=>{
    const used=!!t.used;

    if(status==="tersedia"&&used)return false;
    if(status==="terpakai"&&!used)return false;

    if(q){
      const hay=[
        t.token||"",
        t.usedBy||"",
        t.usedByEmail||"",
        t.paket||""
      ].join(" ").toLowerCase();

      if(!hay.includes(q))return false;
    }

    return true;
  });

  const total=allTokens.length;
  const sedia=allTokens.filter(t=>!t.used).length;
  const pakai=allTokens.filter(t=>t.used).length;

  document.getElementById("stTotal").textContent=total;
  document.getElementById("stSedia").textContent=sedia;
  document.getElementById("stPakai").textContent=pakai;
  document.getElementById("countInfo").textContent=filtered.length+" token";

  let html="";

  filtered.forEach(t=>{
    const used=!!t.used;
    const checked=selected.has(t.id)?"checked":"";

    html+=`
      <tr>
        <td>
          <input type="checkbox" value="${esc(t.id)}" ${checked}
            onchange="toggleOne('${esc(t.id)}',this)" style="width:auto">
        </td>
        <td><b style="letter-spacing:.5px">${esc(t.token||"-")}</b></td>
        <td><b>90 Hari</b></td>
        <td>${used
          ? '<span class="badge off">Terpakai</span>'
          : '<span class="badge ok">Tersedia</span>'}</td>
        <td>${used
          ? '<b>'+esc(t.usedByEmail||t.usedBy||"-")+'</b>'
          : '<span style="color:#94a3b8">Belum dipakai</span>'}</td>
        <td>
          <button class="btn btn-white" onclick="copyText('${esc(t.token||"")}')">Copy</button>
        </td>
      </tr>`;
  });

  document.getElementById("tokenBody").innerHTML=html||
    '<tr><td colspan="6" style="text-align:center;padding:20px">Belum ada token registrasi.</td></tr>';

  updateBulk();
};

window.toggleAll=function(el){
  const on=!!el.checked;

  document.querySelectorAll("#tokenBody input[type=checkbox]").forEach(cb=>{
    cb.checked=on;
    if(on)selected.add(cb.value);
    else selected.delete(cb.value);
  });

  document.getElementById("checkHead").checked=on;
  document.getElementById("checkAll").checked=on;
  updateBulk();
};

window.toggleOne=function(id,el){
  if(el.checked)selected.add(id);
  else selected.delete(id);
  updateBulk();
};

function updateBulk(){
  document.getElementById("countSel").textContent=selected.size;
}

async function copyToClipboard(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.select();
    const ok=document.execCommand("copy");
    ta.remove();
    return ok;
  }
}

window.copyText=async function(txt){
  const ok=await copyToClipboard(txt);
  const msg=document.getElementById("msg");
  msg.style.color=ok?"#15803d":"#dc2626";
  msg.textContent=ok?"Token "+txt+" berhasil disalin.":"Gagal menyalin token.";
};

window.copySelected=async function(){
  if(selected.size===0){
    document.getElementById("msg").style.color="#dc2626";
    document.getElementById("msg").textContent="Pilih token terlebih dahulu.";
    return;
  }

  const teks=allTokens
    .filter(t=>selected.has(t.id))
    .map(t=>t.token)
    .filter(Boolean)
    .join("\n");

  const ok=await copyToClipboard(teks);
  const msg=document.getElementById("msg");
  msg.style.color=ok?"#15803d":"#dc2626";
  msg.textContent=ok?selected.size+" token berhasil disalin.":"Gagal menyalin token.";
};

window.deleteSelected=function(){
  if(selected.size===0){
    document.getElementById("msg").style.color="#dc2626";
    document.getElementById("msg").textContent="Pilih token terlebih dahulu.";
    return;
  }

  showModal(
    "🗑️ Hapus Token",
    "Hapus "+selected.size+" token yang dipilih dari database?",
    "Hapus",
    async()=>{
      const ids=Array.from(selected);
      for(const id of ids){
        try{ await deleteDoc(doc(db,TOKEN_COLLECTION,id)); }catch(e){}
      }
      selected.clear();
      await loadAll();
      document.getElementById("msg").style.color="#15803d";
      document.getElementById("msg").textContent="Token terpilih berhasil dihapus.";
    }
  );
};

window.deleteUsed=function(){
  const used=allTokens.filter(t=>t.used);

  if(used.length===0){
    document.getElementById("msg").style.color="#15803d";
    document.getElementById("msg").textContent="Belum ada token yang terpakai.";
    return;
  }

  showModal(
    "🧹 Hapus Token Terpakai",
    "Akan menghapus "+used.length+" token registrasi yang sudah dipakai. Token yang masih tersedia tidak ikut dihapus.",
    "Hapus yang Terpakai",
    async()=>{
      for(const t of used){
        try{ await deleteDoc(doc(db,TOKEN_COLLECTION,t.id)); }catch(e){}
      }
      selected.clear();
      await loadAll();
      document.getElementById("msg").style.color="#15803d";
      document.getElementById("msg").textContent=used.length+" token terpakai berhasil dihapus.";
    }
  );
};
</script>
</body>
</html>
