<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIXZY | Sambutan & Tentang</title>
<style>
:root{
  --y:#FFC107;
  --orange:#ff9800;
  --bg:#0b0b0b;
  --card:#181818;
  --card2:#222;
  --line:#303030;
  --text:#fff;
  --muted:#d5d5d5;
  --max:1100px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:linear-gradient(#111,#090909);color:var(--text);line-height:1.6}

header{
  padding:25px 20px 28px;text-align:center;
  border-bottom:2px solid var(--y);
  background:radial-gradient(circle at center,#171717 0%,#0b0b0b 70%);
}
.logo{
  width:min(100%,520px);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  box-shadow:none;
}
.logo img{
  width:100%;
  height:auto;
  max-height:360px;
  object-fit:contain;
  display:block;
  border-radius:18px;
}
.welcome-badge{
  display:inline-block;margin-top:15px;padding:7px 13px;
  border-radius:999px;background:#252525;border:1px solid #51430d;
  color:var(--y);font-size:11px;font-weight:900;letter-spacing:.5px
}

/* Kontrol halaman */
.page-controls{
  position:fixed;top:12px;right:12px;z-index:9999;
  display:flex;gap:8px
}
.page-control-btn{
  border:1px solid #3b3210;background:#1d1d1d;color:var(--y);
  padding:10px 14px;border-radius:12px;font-weight:bold;font-size:14px;
  cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.35);transition:.2s
}
.page-control-btn:hover{background:var(--y);color:#111}
.page-control-btn.close{color:#fff;border-color:#444}
.page-control-btn.close:hover{background:#d32f2f;color:#fff}

/* Konten */
.wrap{max-width:var(--max);margin:auto;padding:25px}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:25px;margin-bottom:22px;
  box-shadow:0 10px 25px rgba(0,0,0,.35)
}
.card h2{font-size:30px;color:var(--y);margin-bottom:13px}
.card p{color:#eee;font-size:16px}
.welcome{
  background:linear-gradient(135deg,#1d1d1d,#111);
  border:1px solid #4a3c0a
}
.welcome p{font-size:17px;color:#f1f1f1}
.highlight{
  margin-top:16px;padding:15px 17px;border-left:4px solid var(--y);
  background:#222;border-radius:12px;color:#fff;font-weight:700
}
.signature{margin-top:15px;color:var(--y);font-weight:900}

.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.info{
  background:var(--card2);border:1px solid #333;
  border-radius:16px;padding:17px
}
.info .icon{font-size:27px}
.info h3{margin:6px 0 5px;color:var(--y);font-size:18px}
.info p{font-size:13px;color:#ccc}

details{background:#222;border-radius:15px;margin:12px 0;border:1px solid #2f2f2f}
summary{
  cursor:pointer;padding:16px;font-size:20px;font-weight:bold;
  color:var(--y);list-style:none
}
summary::-webkit-details-marker{display:none}
.content{padding:0 18px 18px}
.content li{padding:9px 0;border-bottom:1px solid #333;color:#eee}
.content li:last-child{border-bottom:0}

.steps{counter-reset:step;list-style:none}
.steps li{
  position:relative;margin:9px 0;padding:13px 15px 13px 48px;
  background:#222;border-radius:12px;color:#eee
}
.steps li:before{
  counter-increment:step;content:counter(step);
  position:absolute;left:12px;top:10px;width:28px;height:28px;
  display:grid;place-items:center;border-radius:50%;
  background:var(--y);color:#111;font-weight:900
}

.closing{text-align:center;background:linear-gradient(135deg,#171717,#0d0d0d)}
.closing h2{font-size:28px}
.closing p{max-width:780px;margin:auto;color:#ddd}
.slogan{
  margin-top:15px;display:inline-block;padding:10px 16px;
  background:linear-gradient(90deg,var(--y),var(--orange));
  color:#111;border-radius:13px;font-weight:900
}
footer{text-align:center;padding:25px;color:#888}

@media(max-width:992px){
  .wrap{padding:20px}
  .logo{width:min(100%,450px)}
  .logo img{max-height:320px}
  .card h2{font-size:27px}
}
@media(max-width:768px){
  header{padding:18px 12px 23px}
  .logo{width:min(100%,360px)}
  .logo img{max-height:270px;border-radius:14px}
  .wrap{padding:15px}
  .card{padding:18px;border-radius:18px}
  .card h2{font-size:23px}
  .grid{grid-template-columns:1fr}
  .welcome p{font-size:15px}
  .page-controls{top:8px;right:8px}
  .page-control-btn{padding:8px 10px;font-size:13px;border-radius:10px}
}
@media(max-width:420px){
  header{padding:14px 8px 20px}
  .logo{width:100%}
  .logo img{max-height:none;border-radius:10px}
  .card h2{font-size:21px}
  .card p{font-size:14px}
}
</style>
</head>
