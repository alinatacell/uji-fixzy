<script type="module">

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};

function formatExpFIXZY(v){
  if(v===undefined || v===null || String(v).trim()==="") return "-";
  if(typeof v==="object" && typeof v.toDate==="function"){
    try{return v.toDate().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});}catch(e){}
  }
  if(typeof v==="object" && v.seconds!==undefined){
    try{
      const d=new Date(Number(v.seconds)*1000);
      if(!Number.isNaN(d.getTime())) return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
    }catch(e){}
  }
  const str=String(v).trim();
  const m=str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    if(!Number.isNaN(d.getTime())) return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  }
  const d=new Date(str);
  if(!Number.isNaN(d.getTime())) return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  return str;
}

function tampilkanBeranda(){

function tutupMenu(){

function refreshIndex(){
  const url=new URL(window.location.href);
  url.searchParams.set("v",Date.now().toString());
  window.location.replace(url.toString());
}
window.refreshIndex=refreshIndex;

const FIXZY_PERMISSION_BY_PAGE={
  // SEMUA MENU YANG BISA DIATUR OWNER LEWAT CHECKLIST KARYAWAN
  // Kalau tambah menu baru, tinggal tambah disini + di kelola-karyawan
  "nota.html":"servis",
  "penjualan.html":"penjualan",
  "dashboard-pendapatan.html":"dashboardPendapatan",
  "data-servis.html":"dataServis",
  "data-penjualan.html":"dataPenjualan",
  "rekap-teknisi.html":"rekapTeknisi",
  "laporan-pendapatan-servis.html":"laporanPendapatan",
  "monitoring-garansi.html":"garansi",
  "stock.html":"stock",
  // Menu owner-only tidak masuk map ini, karena data-roles="owner"
  "upah-kerja.html":"ownerOnly",
  "pengeluaran.html":"ownerOnly",
  "dashboard-admin.html":"ownerOnly",
  "kelola-karyawan-reseller.html":"ownerOnly",
  "hak-akses.html":"ownerOnly",
  "data-karyawan.html":"ownerOnly",
  "cek-aktivasi.html":"ownerOnly",
  "pengaturan.html":"ownerOnly"
};

function permissionTersedia(izin, permission){
  if(izin.includes(permission)) return true;

  // Kompatibilitas dengan data izin lama yang memakai format kebab-case.
  const alias={
    "servis":["servis","nota"],
    "dataServis":["dataServis","data-servis"],
    "dataPenjualan":["dataPenjualan","data-penjualan"],
    "garansi":["garansi","monitoring-garansi"],
    "penjualan":["penjualan"],
    "stock":["stock"]
  };

  return (alias[permission]||[permission]).some(x=>izin.includes(x));
}

function bolehAksesMenu(btn){
  const session=window.fixzySession||{};
  const role=session.role||"";
  const roles=String(btn.dataset.roles||"owner").split(",").map(x=>x.trim()).filter(Boolean);

  if(!roles.includes(role)) return false;

  if(role==="owner" || role==="superadmin") return true;

  const permission=btn.dataset.permission || FIXZY_PERMISSION_BY_PAGE[btn.dataset.page];
  if(!permission) return true;

  const izin=Array.isArray(session.permissions)?session.permissions:[];
  return permissionTersedia(izin,permission);
}

function tampilkanAksesDitolak(){
  const area=document.getElementById("contentArea");
  area.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f4f6">

}

  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));

}

function popupLogout(){
  const old=document.getElementById("fixzyLogoutPopup");
  if(old) old.remove();

  const wrap=document.createElement("div");
  wrap.id="fixzyLogoutPopup";
  wrap.style.cssText="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px";
  wrap.innerHTML=`<div style="width:min(420px,100%);background:#fff;border-radius:15px;padding:18px;box-shadow:0 15px 40px #0004">
    <h3 style="margin:0 0 8px;color:#111827">🚪 Keluar dari FIXZY?</h3>
    <div style="font-size:13px;line-height:1.6;color:#667085">Sesi akun akan ditutup dan Anda akan kembali ke halaman login.</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">
      <button id="fixzyLogoutCancel" style="border:0;border-radius:8px;padding:10px 13px;background:#e5e7eb;color:#111827;font-weight:900;cursor:pointer">Batal</button>
      <button id="fixzyLogoutOk" style="border:0;border-radius:8px;padding:10px 13px;background:#dc2626;color:#fff;font-weight:900;cursor:pointer">Logout</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  document.getElementById("fixzyLogoutCancel").onclick=()=>wrap.remove();
  document.getElementById("fixzyLogoutOk").onclick=async()=>{
    const ok=document.getElementById("fixzyLogoutOk");
    ok.disabled=true;ok.textContent="Keluar...";
    try{ await signOut(auth); }catch(e){ console.warn("Logout Firebase:",e); }
    window.location.replace("login.html");
  };
}

window.logoutFixzy=popupLogout;

async function validasiDanTampilkan(user){
  if(!user){
    authReady=true;
    window.location.replace("login.html");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    const data=snap.data()||{};
    const role=data.role||"";
    const status=data.status||"";

    // Identitas pemilik data FIXZY dibuat konsisten untuk semua role.
    // Owner: uid sendiri. Employee/Reseller: ownerUid dari profil.
    const ownerUid = role==="owner" ? user.uid : (data.ownerUid || "");
    if(!ownerUid && role!=="superadmin"){
      console.error("FIXZY: ownerUid tidak ditemukan untuk akun",user.uid);
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    window.fixzySession={
      uid:user.uid,
      role,
      ownerUid:ownerUid || user.uid,
      profile:data,
      permissions:Array.isArray(data.izin)
        ? data.izin
        : (Array.isArray(data.permissions) ? data.permissions : [])
    };

    if(!["owner","employee","reseller","superadmin"].includes(role)){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    if(status!=="aktif" || status==="blocked" || status==="rejected"){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    /*
  SUMBER TANGGAL AKTIVASI FIXZY
  Samakan dengan halaman Cek Aktivasi:
  1. exp
  2. expAt
  3. expiredAt
  4. tanggalBerakhir
*/
const exp =
  data.exp ||
  data.expAt ||
  data.expiredAt ||
  data.tanggalBerakhir ||
  null;

let expDate=null;

if(exp && typeof exp.toDate==="function"){
  expDate=exp.toDate();
}
else if(exp && typeof exp==="object" && exp.seconds!==undefined){
  expDate=new Date(Number(exp.seconds)*1000);
}
else if(exp){
  expDate=new Date(exp);
}

if(expDate && !Number.isNaN(expDate.getTime()) && new Date()>expDate){
  await signOut(auth);
  window.location.replace("login.html");
  return;
}
