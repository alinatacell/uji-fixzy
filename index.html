<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>FIXZY</title>
<meta name="fixzy-version" content="index-fixed-20260817-01">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#111827}
body{overflow:hidden}
.header{height:62px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;position:fixed;top:0;left:0;right:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.menu-btn{width:44px;height:44px;margin-left:9px;border:0;border-radius:11px;background:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}

/* Hanya warna 3 garis hamburger yang diubah menjadi kuning */
.menu-btn span{width:21px;height:2px;background:#FFC107;border-radius:4px;box-shadow:0 1px 0 rgba(255,193,7,.45)}

.header-running{flex:1;min-width:0;height:42px;margin-left:12px;margin-right:8px;overflow:hidden;display:flex;align-items:center;position:relative;border-radius:10px;background:#fff}
.running-track{display:flex;align-items:center;width:max-content;white-space:nowrap;animation:fixzyRunning 28s linear infinite;font-size:12px;font-weight:800;color:#374151}
.running-track span{display:inline-flex;align-items:center;margin-right:42px}
@keyframes fixzyRunning{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* Nama akun dibuat efek 3D, posisi dan elemen lain tetap */
.header-account{margin-left:auto;margin-right:13px;text-align:right;line-height:1.15}
.account-name{
  font-size:12px;
  font-weight:900;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#FFC107;
  text-shadow:
    1px 1px 0 #111827,
    2px 2px 2px rgba(0,0,0,.45);
  transform:perspective(160px) rotateX(2deg);
  transform-origin:right center;
}
.account-exp{font-size:9px;color:#6b7280;margin-top:3px}
.content{position:fixed;top:62px;left:0;right:0;bottom:0;background:#f3f4f6;overflow:hidden}
.content iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);opacity:0;visibility:hidden;transition:.2s}
.overlay.show{opacity:1;visibility:visible}
.menu{position:fixed;z-index:50;top:0;left:0;height:100dvh;width:min(310px,86vw);background:#fff;transform:translateX(-105%);transition:.25s ease;box-shadow:8px 0 30px rgba(0,0,0,.15);overflow:auto}
.menu.show{transform:translateX(0)}
.menu-head{min-height:62px;padding:10px 13px;background:#111827;color:#fff;display:flex;align-items:center;gap:10px}
.menu-head img{width:78px;max-height:40px;object-fit:contain;background:#000;border-radius:7px}
.menu-title{font-weight:900;font-size:15px}
.menu-sub{font-size:9px;color:#d1d5db;margin-top:3px}
.close{margin-left:auto;border:0;background:rgba(255,255,255,.12);color:#fff;width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
.menu-list{padding:9px}
.menu-link{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-decoration:none;color:#111827;padding:12px 11px;border-radius:10px;font-size:13px;font-weight:800;text-align:left;cursor:pointer}
.menu-link:hover,.menu-link.active{background:#f3f4f6}
.menu-link .ico{width:25px;text-align:center;font-size:16px}
.logout-link{color:#dc2626;font-weight:900}
.logout-link:hover{background:#fef2f2}
@media(max-width:480px){
  .header-running{margin-left:8px;margin-right:5px;height:38px}
  .running-track{font-size:10px;animation-duration:24s}
  .header-account{margin-right:9px}
  .account-name{font-size:11px;max-width:150px}
}
</style>
</head>

<body>
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="header-running">
    <div class="running-track">
      <span>🌟 Selamat Datang di FIXZY</span>
      <span>🤲 Semoga usaha hari ini lancar</span>

<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="logo.png?v=2" alt="FIXZY">

      <span class="ico">🧾</span>Daftar Pengguna
    </button>
    <button class="menu-link" data-page="token-registrasi.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="penjualan" onclick="bukaHalaman(this)">
      <span class="ico">🔐</span>Token Registrasi
    </button>
    <button class="menu-link" data-page="token-reseller.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="dataServis" onclick="bukaHalaman(this)">

    </button>
    <button class="menu-link" data-page="token-perpanjangan.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="dataPenjualan" onclick="bukaHalaman(this)">
      <span class="ico">💶</span>Token Perpanjangan
    </button>
    <button class="menu-link" data-page="request-saldo.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="stock" onclick="bukaHalaman(this)">
      <span class="ico">🪙</span>Approval Saldo
    </button>
    <button class="menu-link" data-page="request-token.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="laporanKeuangan" onclick="bukaHalaman(this)">
      <span class="ico">💰</span>Approval Token
    </button>
    
    <button class="menu-link" data-page="saldo-token.html" data-roles="owner,superadmin" data-permission="ownerOnly" onclick="bukaHalaman(this)">
      <span class="ico">🔐</span>Izin Akses
    </button>

    <button class="menu-link" data-page="pengaturan.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="cekAktivasi" onclick="bukaHalaman(this)">
      <span class="ico">🤝</span>Resseler Fixzy
    </button>

    <button class="menu-link" data-page="cek-paket.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller" data-permission="cekAktivasi" onclick="bukaHalaman(this)">
      <span class="ico">⌛</span>Cek Aktivasi
    </button>
    <button class="menu-link" data-page="about.html" data-roles="owner,employee,karyawan,kasir,kurir,reseller,superadmin" onclick="bukaHalaman(this)">
      <span class="ico">ℹ️</span>About
    </button>
    <button class="menu-link logout-link" type="button" onclick="logoutFixzy()">
      <span class="ico">🚪</span>Logout
    </button>
  </nav>
</aside>

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={
  apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
  authDomain:"fixzy-update.firebaseapp.com",
  projectId:"fixzy-update",
  storageBucket:"fixzy-update.firebasestorage.app",
  messagingSenderId:"995892519622",
  appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=getApps().length?getApp():initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);

/* Bridge untuk halaman iframe seperti pengaturan.html */
window.fixzyFirebase={app,auth,db};

let authReady=false;

function formatExpFIXZY(v){
  if(v===undefined||v===null||String(v).trim()==="")return "-";
  if(typeof v==="object"&&typeof v.toDate==="function"){
    try{return v.toDate().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});}catch(e){}
  }
  if(typeof v==="object"&&v.seconds!==undefined){
    try{
      const d=new Date(Number(v.seconds)*1000);
      if(!Number.isNaN(d.getTime()))return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
    }catch(e){}
  }
  const str=String(v).trim();
  const m=str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    if(!Number.isNaN(d.getTime()))return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  }
  const d=new Date(str);
  if(!Number.isNaN(d.getTime()))return d.toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
  return str;
}

function tampilkanBeranda(){
  const area=document.getElementById("contentArea");
  if(!area)return;
  area.innerHTML="";
  const frame=document.createElement("iframe");
  frame.src="page.html";
  frame.title="FIXZY";
  frame.style.cssText="width:100%;height:100%;border:0;display:block;background:#0b0b0c";
  area.appendChild(frame);
  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
}

function bukaMenu(){
  document.getElementById("menu").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}
window.bukaMenu=bukaMenu;

function tutupMenu(){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}
window.tutupMenu=tutupMenu;

function refreshIndex(){
  const url=new URL(window.location.href);
  url.searchParams.set("v",Date.now().toString());
  window.location.replace(url.toString());
}
window.refreshIndex=refreshIndex;

const FIXZY_PERMISSION_BY_PAGE={
  "servisan.html":"servis",
  "nota.html":"servis",
  "penjualan.html":"penjualan",
  "dashboard-pendapatan.html":"dashboardPendapatan",
  "data-servis.html":"dataServis",
  "data-penjualan.html":"dataPenjualan",
  "rekap-teknisi.html":"rekapTeknisi",
  "laporan-pendapatan-servis.html":"laporanPendapatan",
  "laporan-keuangan.html":"laporanKeuangan",
  "monitoring-garansi.html":"garansi",
  "stock.html":"stock",
  "absensi-karyawan.html":"absensi",
  "data-karyawan.html":"dataKaryawan",
  "cek-paket.html":"cekAktivasi",
  "dashboard-admin.html":"ownerOnly",
  "izin-akses.html":"ownerOnly",
  "hak-akses.html":"ownerOnly",
  "kelola-karyawan-reseller.html":"ownerOnly",
  "upah-kerja.html":"ownerOnly",
  "pengeluaran.html":"pengeluaran",
  "pengaturan.html":"cekAktivasi"
};

function normalisasiIzin(value){
  if(Array.isArray(value))return value.map(x=>String(x??"").trim()).filter(Boolean);
  if(value&&typeof value==="object")return Object.keys(value).filter(k=>value[k]===true||value[k]==="true");
  if(typeof value==="string")return value.split(/[,|;]+/).map(x=>x.trim()).filter(Boolean);
  return [];
}

function permissionTersedia(izin,permission){
  if(!permission)return true;
  const daftar=normalisasiIzin(izin).map(x=>x.toLowerCase());
  const p=String(permission).toLowerCase();
  if(p==="owneronly")return false;

  const alias={
    servis:["servis","nota","inputservis","inputservisan"],
    penjualan:["penjualan","inputpenjualan"],
    dataservis:["dataservis","data-servis","data_servis"],
    datapenjualan:["datapenjualan","data-penjualan","data_penjualan"],
    stock:["stock","stok","produk","stokproduk"],
    laporankeuangan:["laporankeuangan","laporan-keuangan","laporan_keuangan"],
    absensi:["absensi","absensikaryawan","absensi-karyawan"],
    datakaryawan:["datakaryawan","data-karyawan","karyawan"],
    pengeluaran:["pengeluaran","inputpengeluaran"],
    cekaktivasi:["cekaktivasi","cek-aktivasi","cekpaket","cek-paket","aktivasi"],
    dashboardpendapatan:["dashboardpendapatan","dashboard-pendapatan"],
    rekapteknisi:["rekapteknisi","rekap-teknisi"],
    laporanpendapatan:["laporanpendapatan","laporan-pendapatan-servis"],
    garansi:["garansi","monitoring-garansi"]
  };

  const candidates=alias[p]||[p];
  return candidates.some(c=>{
    const x=String(c).toLowerCase();
    return daftar.some(i=>i===x||i.replace(/[\s_-]/g,"")===x.replace(/[\s_-]/g,""));
  });
}

function roleDiizinkan(btn,role){
  const roles=String(btn.dataset.roles||"owner").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);
  const r=String(role||"").toLowerCase();
  if(r==="employee"&&roles.includes("karyawan"))return true;
  if(r==="karyawan"&&roles.includes("employee"))return true;
  return roles.includes(r);
}

function bolehAksesMenu(btn){
  const session=window.fixzySession||{};
  const role=String(session.role||"").toLowerCase();
  if(!roleDiizinkan(btn,role))return false;
  if(role==="owner"||role==="superadmin")return true;

  const permission=btn.dataset.permission||FIXZY_PERMISSION_BY_PAGE[btn.dataset.page]||"";
  if(!permission)return true;
  if(permission==="ownerOnly")return false;

  return permissionTersedia(session.permissions,permission);
}

function terapkanHakAksesMenu(){
  document.querySelectorAll(".menu-link[data-page]").forEach(btn=>{
    const boleh=bolehAksesMenu(btn);
    btn.style.display=boleh?"":"none";
    btn.setAttribute("aria-hidden",boleh?"false":"true");
  });
}

function tampilkanAksesDitolak(){
  const area=document.getElementById("contentArea");
  area.innerHTML=`<div style="height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f4f6">
    <div style="width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 5px 20px #0001">
      <div style="font-size:42px">🔒</div>
      <h2 style="margin:10px 0 7px;font-size:20px">Akses Terbatas</h2>
      <p style="margin:0;color:#667085;font-size:13px;line-height:1.6">Akun ini tidak memiliki izin untuk membuka halaman tersebut.</p>
    </div>
  </div>`;
}

function bukaHalaman(btn){
  if(!authReady||!auth.currentUser){
    window.location.replace("login.html");
    return;
  }
  if(!bolehAksesMenu(btn)){
    tampilkanAksesDitolak();
    tutupMenu();
    return;
  }

  const area=document.getElementById("contentArea");
  area.innerHTML="";
  const frame=document.createElement("iframe");
  frame.title="Halaman FIXZY";
  frame.src=btn.dataset.page;
  frame.style.cssText="width:100%;height:100%;border:0;display:block;background:#fff";
  area.appendChild(frame);

  document.querySelectorAll(".menu-link").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  tutupMenu();
}
window.bukaHalaman=bukaHalaman;

function popupLogout(){
  const old=document.getElementById("fixzyLogoutPopup");
  if(old)old.remove();

  const wrap=document.createElement("div");
  wrap.id="fixzyLogoutPopup";
  wrap.style.cssText="position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px";
  wrap.innerHTML=`<div style="width:min(420px,100%);background:#fff;border-radius:15px;padding:18px;box-shadow:0 15px 40px #0004">
    <h3 style="margin:0 0 8px;color:#111827">🚪 Keluar dari FIXZY?</h3>
    <div style="font-size:13px;line-height:1.6;color:#667085">Sesi akun akan ditutup dan Anda akan kembali ke halaman login.</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">
      <button id="fixzyLogoutCancel" style="border:0;border-radius:8px;padding:10px 13px;background:#e5e7eb;color:#111827;font-weight:900;cursor:pointer">Batal</button>
      <button id="fixzyLogoutOk" style="border:0;border-radius:8px;padding:10px 13px;background:#dc2626;color:#fff;font-weight:900;cursor:pointer">Logout</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  document.getElementById("fixzyLogoutCancel").onclick=()=>wrap.remove();
  document.getElementById("fixzyLogoutOk").onclick=async()=>{
    const ok=document.getElementById("fixzyLogoutOk");
    ok.disabled=true;
    ok.textContent="Keluar...";
    try{await signOut(auth)}catch(e){console.warn("Logout Firebase:",e)}
    window.location.replace("login.html");
  };
}
window.logoutFixzy=popupLogout;

async function validasiDanTampilkan(user){
  if(!user){
    authReady=false;
    document.getElementById("accountName").textContent="Memuat...";
    document.getElementById("accountExp").textContent="-";
    window.location.replace("login.html");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(!snap.exists()){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    const data=snap.data()||{};
    const role=String(data.role||"").toLowerCase();
    const status=String(data.status||"").toLowerCase();

    const ownerUid=role==="owner"?user.uid:(data.ownerUid||"");
    if(!ownerUid&&role!=="superadmin"){
      console.error("FIXZY: ownerUid tidak ditemukan untuk akun",user.uid);
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    const allowedRoles=["owner","employee","karyawan","kasir","kurir","reseller","superadmin"];
    if(!allowedRoles.includes(role)){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    if(status!=="aktif"||status==="blocked"||status==="rejected"){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    const exp=data.exp||data.expAt||data.expiredAt||data.tanggalBerakhir||null;
    let expDate=null;

    if(exp&&typeof exp.toDate==="function")expDate=exp.toDate();
    else if(exp&&typeof exp==="object"&&exp.seconds!==undefined)expDate=new Date(Number(exp.seconds)*1000);
    else if(exp)expDate=new Date(exp);

    if(expDate&&!Number.isNaN(expDate.getTime())&&new Date()>expDate){
      await signOut(auth);
      window.location.replace("login.html");
      return;
    }

    window.fixzySession={
      uid:user.uid,
      role,
      ownerUid:ownerUid||user.uid,
      profile:data,
      permissions:normalisasiIzin(data.izin??data.permissions??data.hakAkses??data.access)
    };

    document.getElementById("accountName").textContent=
      data.namaKonter||data.namaPemilik||data.nama||user.email||"Akun";
    document.getElementById("accountExp").textContent=formatExpFIXZY(exp);

    authReady=true;
    terapkanHakAksesMenu();
    tampilkanBeranda();
  }catch(err){
    console.error("FIXZY auth/profile:",err);
    await signOut(auth).catch(()=>{});
    window.location.replace("login.html");
  }
}

onAuthStateChanged(auth,user=>{validasiDanTampilkan(user)});
</script>
</body>
