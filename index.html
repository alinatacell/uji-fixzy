<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FFC107">
<title>FIXZY</title>
<meta name="fixzy-version" content="index-exp-firebase-20260810-01">

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

body{overflow:hidden}

/* ================= HEADER ================= */
.header{
  height:62px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.menu-btn{
  width:44px;
  height:44px;
  margin-left:9px;
  border:0;
  border-radius:11px;
  background:#111827;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  cursor:pointer;
}

.menu-btn span{
  width:21px;
  height:2px;
  background:#fff;
  border-radius:4px;
}

/* RUNNING TEXT HEADER */
.header-running{
  flex:1;
  min-width:0;
  height:42px;
  margin-left:12px;
  margin-right:8px;
  overflow:hidden;
  display:flex;
  align-items:center;
  position:relative;
  border-radius:10px;
  background:#fff;
}

.running-track{
  display:flex;
  align-items:center;
  width:max-content;
  white-space:nowrap;
  animation:fixzyRunning 28s linear infinite;
  font-size:12px;
  font-weight:800;
  color:#374151;
}

.running-track span{
  display:inline-flex;
  align-items:center;
  margin-right:42px;
}

@keyframes fixzyRunning{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

.header-account{
  margin-left:auto;
  margin-right:13px;
  text-align:right;
  line-height:1.15;
}

.account-name{
  font-size:12px;
  font-weight:900;
  max-width:190px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.account-exp{
  font-size:9px;
  color:#6b7280;
  margin-top:3px;
}

/* ================= CONTENT ================= */
.content{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  bottom:0;
  background:#f3f4f6;
  overflow:hidden;
}

.content iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

/* ================= HALAMAN SELAMAT DATANG ================= */
.welcome{
  width:100%;
  height:100%;
  overflow:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
  background:#f3f4f6;
}

.welcome-card{
  width:min(760px,100%);
  text-align:center;
  padding:25px 20px 32px;
}

.welcome-logo{
  display:block;
  width:min(430px,78vw);
  max-height:330px;
  object-fit:contain;
  margin:0 auto 18px;
}

.welcome-title{
  margin:0;
  font-size:clamp(25px,5vw,42px);
  font-weight:1000;
  letter-spacing:.5px;
  color:#111827;
}

.welcome-tagline{
  margin:7px 0 14px;
  font-size:clamp(17px,3vw,24px);
  font-weight:900;
  color:#f59e0b;
}

.welcome-desc{
  margin:0 auto;
  max-width:650px;
  font-size:clamp(13px,2.2vw,16px);
  line-height:1.65;
  color:#6b7280;
}

.welcome-hint{
  display:inline-block;
  margin-top:22px;
  padding:10px 16px;
  border-radius:12px;
  background:#fff;
  border:1px solid #e5e7eb;
  font-size:12px;
  font-weight:800;
  color:#374151;
}

/* ================= OVERLAY ================= */
.overlay{
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(0,0,0,.28);
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* ================= MENU ================= */
.menu{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  height:100dvh;
  width:min(310px,86vw);
  background:#fff;
  transform:translateX(-105%);
  transition:.25s ease;
  box-shadow:8px 0 30px rgba(0,0,0,.15);
  overflow:auto;
}

.menu.show{
  transform:translateX(0);
}

.menu-head{
  min-height:62px;
  padding:10px 13px;
  background:#111827;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-head img{
  width:78px;
  max-height:40px;
  object-fit:contain;
  background:#000;
  border-radius:7px;
}

.menu-title{
  font-weight:900;
  font-size:15px;
}

.menu-sub{
  font-size:9px;
  color:#d1d5db;
  margin-top:3px;
}

.close{
  margin-left:auto;
  border:0;
  background:rgba(255,255,255,.12);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:20px;
  cursor:pointer;
}

.menu-list{
  padding:9px;
}

.menu-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  text-decoration:none;
  color:#111827;
  padding:12px 11px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
}

.menu-link:hover,
.menu-link.active{
  background:#f3f4f6;
}

.menu-link .ico{
  width:25px;
  text-align:center;
  font-size:16px;
}

.logout-link{
  color:#dc2626;
  font-weight:900;
}

.logout-link:hover{
  background:#fef2f2;
}

.menu-divider{
  height:1px;
  background:#e5e7eb;
  margin:7px 5px;
}

/* ================= MOBILE ================= */
@media(max-width:480px){
  .header-running{
    margin-left:8px;
    margin-right:5px;
    height:38px;
  }

  .running-track{
    font-size:10px;
    animation-duration:24s;
  }

  .header-account{
    margin-right:9px;
  }

  .account-name{
    font-size:11px;
    max-width:150px;
  }

  .welcome{
    padding:20px 12px;
  }

  .welcome-card{
    padding:18px 10px 28px;
  }

  .welcome-logo{
    width:min(330px,82vw);
    max-height:250px;
    margin-bottom:12px;
  }

  .welcome-tagline{
    margin-top:5px;
  }
}

/* LOGIN POPUP - struktur index asli dipertahankan */
.login-overlay{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.62);display:none;align-items:center;justify-content:center;padding:14px}
.login-overlay.show{display:flex}
.login-box{width:min(440px,100%);height:min(720px,92vh);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.28);position:relative}
.login-box iframe{width:100%;height:100%;border:0;background:#fff}
.login-close{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:20px;display:none}
</style>
</head>

<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <iframe id="loginFrame" title="Login FIXZY"></iframe>
  </div>
</div>


<!-- ================= HEADER ================= -->
<header class="header">
  <button class="menu-btn" onclick="bukaMenu()" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="header-running">
    <div class="running-track">
      <span>🌟 Selamat Datang di FIXZY</span>
      <span>🤲 Semoga usaha hari ini lancar</span>
      <span>💰 Semoga rezeki bertambah dan berkah</span>
      <span>🙏 Semoga semua urusan dimudahkan</span>
    </div>
  </div>

  <div class="header-account">
    <div class="account-name" id="accountName">Akun</div>
    <div class="account-exp">
      Exp: <span id="accountExp">-</span>
    </div>
  </div>
</header>

<!-- ================= CONTENT ================= -->
<div class="content" id="contentArea"></div>

<!-- ================= OVERLAY ================= -->
<div class="overlay" id="overlay" onclick="tutupMenu()"></div>

<!-- ================= MENU ================= -->
<aside class="menu" id="menu">
  <div class="menu-head">
    <img src="logo.png?v=2" alt="FIXZY">
    <div>
      <div class="menu-title">Menu FIXZY</div>
      <div class="menu-sub">Pilih halaman</div>
    </div>
    <button class="close" onclick="tutupMenu()">×</button>
  </div>

  <nav class="menu-list">

    <button class="menu-link" onclick="refreshIndex()">
      <span class="ico">🔄</span>
      Refresh Halaman
    </button>

<button class="menu-link"
      data-page="nota.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🧾</span>
      Input nota servisan
    </button>
    
<button class="menu-link"
      data-page="penjualan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🧾</span>
      Input nota penjualan
    </button>

    <button class="menu-link"
      data-page="data-servis.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🔧</span>
      Data Servis
    </button>

    <button class="menu-link"
      data-page="data-penjualan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🛒</span>
      Data Penjualan
    </button>

    <button class="menu-link"
      data-page="stock.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📦</span>
      Stock Produk
    </button>

    <button class="menu-link"
      data-page="data-karyawan.html"
      onclick="bukaHalaman(this)">
      <span class="ico">👥</span>
      Data Karyawan
    </button>

    <button class="menu-link"
      data-page="upah-kerja.html"
      onclick="bukaHalaman(this)">
      <span class="ico">💰</span>
      Upah Karyawan
    </button>

    <button class="menu-link"
      data-page="pengeluaran.html"
      onclick="bukaHalaman(this)">
      <span class="ico">💸</span>
      Pengeluaran
    </button>

    <button class="menu-link"
      data-page="dashboard-admin.html"
      onclick="bukaHalaman(this)">
      <span class="ico">📊</span>
      Dashboard Admin
    </button>
    
    <div class="menu-divider"></div>

    <button class="menu-link"
      data-page="cek-aktivasi.html"
      onclick="bukaHalaman(this)">
      <span class="ico">🔐</span>
      Cek Aktivasi
    </button>

    <button class="menu-link"
      data-page="page.html"
      onclick="bukaHalaman(this)">
      <span class="ico">ℹ️</span>
      About
    </button>

    <div class="menu-divider"></div>

    <button class="menu-link logout-link"
      type="button"
      onclick="logoutFixzy()">
      <span class="ico">🚪</span>
      Logout
    </button>

  </nav>
</aside>

<script>
/* =========================================================
   FIXZY INDEX
   - Belum login  : tampilkan login.html
   - Sudah login  : tampilkan halaman sambutan
   - Login sukses  : simpan profil dan tampilkan sambutan
   ========================================================= */

function sudahLogin(){
  return sessionStorage.getItem("fixzy_logged_in") === "1";
}

/* ================= LOGOUT ================= */
window.logoutFixzy = async function(){
  if(!confirm("Yakin ingin logout dari FIXZY?")) return;

  try{
    const { initializeApp } =
      await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
    const { getAuth, signOut } =
      await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js");

    const firebaseConfig = {
      apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
      authDomain:"fixzy-f056f.firebaseapp.com",
      projectId:"fixzy-f056f",
      storageBucket:"fixzy-f056f.firebasestorage.app",
      messagingSenderId:"838081521031",
      appId:"1:838081521031:web:50fdee909b56460b055f22"
    };

    const app = initializeApp(firebaseConfig,"FIXZY_LOGOUT");
    await signOut(getAuth(app));
  }catch(e){
    console.warn("Logout Firebase:",e);
  }

  sessionStorage.removeItem("fixzy_logged_in");
  localStorage.removeItem("fixzy_logged_in");
  localStorage.removeItem("fixzy_uid");
  localStorage.removeItem("fixzy_role");
  localStorage.removeItem("fixzy_user_profile");

  document.getElementById("accountName").textContent="Akun";
  document.getElementById("accountExp").textContent="-";

  tutupMenu();
  window.location.replace("login.html");
}

function bukaMenu(){
  document.getElementById("menu").classList.add("show");
  document.getElementById("overlay").classList.add("show");
}

function tutupMenu(){
  document.getElementById("menu").classList.remove("show");
  document.getElementById("overlay").classList.remove("show");
}

/* ================= REFRESH INDEX =================
   Cache-busting agar versi index terbaru lebih cepat terbaca.
*/
function refreshIndex(){
  const url = new URL(window.location.href);
  url.searchParams.set("v", Date.now().toString());
  window.location.replace(url.toString());
}

/* ================= HALAMAN LOGIN ================= */
function tampilkanLogin(){
  window.location.replace("login.html");
}

/* ================= HALAMAN SAMBUTAN ================= */
function tampilkanBeranda(){
  const area = document.getElementById("contentArea");
  if(!area) return;

  area.innerHTML = `
    <iframe
      src="page.html"
      title="FIXZY"
      style="width:100%;height:calc(100vh - 86px);min-height:700px;border:0;display:block;background:#0b0b0c;"
    ></iframe>
  `;

  document.querySelectorAll(".menu-link")
    .forEach(x => x.classList.remove("active"));
}

/* ================= BUKA HALAMAN MENU ================= */
function bukaHalaman(btn){
  if(!sudahLogin()){
    tampilkanLogin();
    tutupMenu();
    return;
  }

  const page = btn.dataset.page;
  const area = document.getElementById("contentArea");

  area.innerHTML = "";

  const frame = document.createElement("iframe");
  frame.title = "Halaman FIXZY";
  frame.src = page;
  frame.style.cssText =
    "width:100%;height:100%;border:0;display:block;background:#fff;";

  area.appendChild(frame);

  document.querySelectorAll(".menu-link")
    .forEach(x => x.classList.remove("active"));

  btn.classList.add("active");

  tutupMenu();
}

/* ================= PESAN DARI LOGIN ================= */
window.addEventListener("message", function(e){
  const d = e.data || {};

  if(d.type === "FIXZY_LOGIN_SUCCESS"){

    sessionStorage.setItem("fixzy_logged_in", "1");

    localStorage.setItem(
      "fixzy_user_profile",
      JSON.stringify({
        nama: d.nama || "Akun",
        exp: d.exp || "-",
        role: d.role || "user"
      })
    );

    bacaProfil();

    /* Setelah login berhasil: tutup popup lalu masuk halaman utama */
    document.getElementById("loginOverlay").classList.remove("show");
    tampilkanBeranda();
  }

  if(d.type === "FIXZY_REGISTER_SUCCESS"){
    /* Setelah registrasi, tampilkan kembali halaman login */
    tampilkanLogin();
  }
});

/* ================= BACA PROFIL AKUN ================= */
function formatExpFIXZY(v){
  if(v===undefined || v===null || String(v).trim()==="") return "-";

  /* Firestore Timestamp */
  if(typeof v==="object" && typeof v.toDate==="function"){
    try{
      const d=v.toDate();
      return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"long",
        year:"numeric"
      });
    }catch(e){}
  }

  if(typeof v==="object" && v.seconds!==undefined){
    try{
      const d=new Date(Number(v.seconds)*1000);
      if(!Number.isNaN(d.getTime())){
        return d.toLocaleDateString("id-ID",{
          day:"2-digit",
          month:"long",
          year:"numeric"
        });
      }
    }catch(e){}
  }

  const s=String(v).trim();

  /* YYYY-MM-DD atau YYYY-MM-DDTHH:mm:ss... */
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
  if(m){
    const y=Number(m[1]);
    const mo=Number(m[2]);
    const day=Number(m[3]);

    /* Jangan pernah menggeser tahun. 2026 tetap 2026. */
    if(y>=2000 && y<=2100 && mo>=1 && mo<=12 && day>=1 && day<=31){
      const d=new Date(y,mo-1,day);
      if(!Number.isNaN(d.getTime())){
        return d.toLocaleDateString("id-ID",{
          day:"2-digit",
          month:"long",
          year:"numeric"
        });
      }
    }
  }

  /* Format tanggal umum lain */
  const d=new Date(s);
  if(!Number.isNaN(d.getTime())){
    return d.toLocaleDateString("id-ID",{
      day:"2-digit",
      month:"long",
      year:"numeric"
    });
  }

  return s;
}

function bacaProfil(){
  let p={};

  try{
    p=JSON.parse(
      localStorage.getItem("fixzy_user_profile") || "{}"
    );
  }catch(e){
    p={};
  }

  const nama =
    p.nama ||
    p.namaToko ||
    p.namaUsaha ||
    p.toko ||
    p.email ||
    "Akun";

  const rawExp =
    p.exp ||
    p.expired ||
    p.expiry ||
    p.masaAktif ||
    p.tanggalExp ||
    p.tanggalExpired ||
    "-";

  document.getElementById("accountName").textContent=nama;
  document.getElementById("accountExp").textContent=formatExpFIXZY(rawExp);
}

/* ================= SINKRON EXP LANGSUNG DARI FIREBASE =================
   Index sebelumnya hanya membaca localStorage. Setelah perpanjangan
   disetujui di Kendali Admin, localStorage bisa masih berisi tanggal lama.
   Sekarang index membaca dokumen users yang sedang login dan mengambil
   tanggal EXP terbaru dari Firebase.
*/
async function sinkronExpFirebase(){
  try{
    const {initializeApp,getApps,getApp} =
      await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
    const {getAuth,onAuthStateChanged} =
      await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js");
    const {getFirestore,doc,getDoc} =
      await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");

    const firebaseConfig={
      apiKey:"AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
      authDomain:"fixzy-f056f.firebaseapp.com",
      projectId:"fixzy-f056f",
      storageBucket:"fixzy-f056f.firebasestorage.app",
      messagingSenderId:"838081521031",
      appId:"1:838081521031:web:50fdee909b56460b055f22"
    };

    const app=getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth=getAuth(app);
    const db=getFirestore(app);

    onAuthStateChanged(auth,async user=>{
      if(!user)return;

      try{
        const snap=await getDoc(doc(db,"users",user.uid));
        if(!snap.exists())return;

        const data=snap.data()||{};

        const nama =
          data.namaKonter ||
          data.namaToko ||
          data.namaUsaha ||
          data.toko ||
          data.nama ||
          user.email ||
          "Akun";

        const rawExp =
          data.tanggalExpired ??
          data.tanggalExp ??
          data.masaAktif ??
          data.expired ??
          data.expiry ??
          data.exp ??
          data.tanggalBerakhir ??
          data.activationExpiry ??
          data.activationExpires ??
          data.activationEnd ??
          data.expiresAt ??
          data.expiredAt ??
          data.activationExpiresAt ??
          "-";

        const formattedExp=formatExpFIXZY(rawExp);

        document.getElementById("accountName").textContent=nama;
        document.getElementById("accountExp").textContent=formattedExp;

        /* Simpan tanggal terbaru agar halaman lain tidak memakai cache lama. */
        try{
          const old={};
          try{
            Object.assign(
              old,
              JSON.parse(localStorage.getItem("fixzy_user_profile")||"{}")
            );
          }catch(e){}

          old.nama=nama;
          old.email=user.email||old.email||"";
          old.uid=user.uid;
          old.exp=rawExp;
          old.expFormatted=formattedExp;

          localStorage.setItem(
            "fixzy_user_profile",
            JSON.stringify(old)
          );
        }catch(e){}
      }catch(e){
        console.warn("FIXZY sinkron EXP Firebase:",e);
      }
    });
  }catch(e){
    console.warn("Firebase index tidak dapat dimuat:",e);
  }
}

/* ================= START ================= */
bacaProfil();
sinkronExpFirebase();

if(sudahLogin()){
  tampilkanBeranda();
}else{
  /* Login berada di login.html.
     Setelah login berhasil, login.html kembali ke index.html. */
  window.location.replace("login.html");
}
</script>

</body>
</html>
