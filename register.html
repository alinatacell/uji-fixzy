<!DOCTYPE html>
<html lang="id">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>

  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fixzy | Registrasi</title>
<meta name="theme-color" content="#FFC107">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html{scroll-behavior:smooth;}
body{background:#0d0d0d;background-image:radial-gradient(circle at top, rgba(255,193,7,.18), transparent 60%);color:#fff;min-height:100vh;overflow-x:hidden;}
.container{width:100%;max-width:430px;margin:auto;padding:20px 15px 40px;}
.card{background:#1b1b1b;border-radius:25px;padding:25px;border:1px solid rgba(255,193,7,.15);box-shadow:0 15px 35px rgba(0,0,0,.45);}
.logo-area{text-align:center;margin-bottom:25px;}
.logo{width:170px;height:170px;object-fit:contain;padding:10px;border-radius:30px;background:#111;box-shadow:0 0 25px rgba(255,193,7,.35),0 0 60px rgba(255,193,7,.15);animation:logoGlow 2.5s infinite alternate;}
@keyframes logoGlow{0%{transform:scale(1);box-shadow:0 0 20px rgba(255,193,7,.25);}100%{transform:scale(1.03);box-shadow:0 0 40px rgba(255,193,7,.5);}}
.logo-area h1{margin-top:18px;font-size:30px;font-weight:700;color:#FFC107;}
.logo-area p{margin-top:8px;font-size:15px;color:#bdbdbd;}
.input-box{margin-bottom:18px;}
.input-box label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#FFC107;}
.input-box input,.input-box textarea{width:100%;padding:14px;background:#252525;border:1px solid #333;border-radius:14px;font-size:15px;color:#fff;outline:none;transition:.25s;}
.input-box textarea{resize:none;min-height:90px;}
.input-box input:focus,.input-box textarea:focus{border-color:#FFC107;box-shadow:0 0 12px rgba(255,193,7,.25);}
.password{display:flex;align-items:center;background:#252525;border:1px solid #333;border-radius:14px;overflow:hidden;}
.password input{border:none!important;background:transparent!important;box-shadow:none!important;margin:0;}
.password button{width:55px;height:50px;border:none;background:#FFC107;color:#111;font-size:20px;cursor:pointer;transition:.3s;}
.password button:hover{background:#FFD54F;}
.trial{margin:20px 0;padding:15px;text-align:center;border-radius:14px;background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.25);color:#FFC107;font-weight:700;}
.check{display:flex;gap:10px;margin:18px 0;font-size:14px;color:#ddd;}
.check input{margin-top:4px;transform:scale(1.15);accent-color:#FFC107;}
#btnDaftar{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(90deg,#FFC107,#FF9800);color:#111;font-size:17px;font-weight:700;cursor:pointer;transition:.3s;box-shadow:0 10px 25px rgba(255,193,7,.30);}
#btnDaftar:hover{transform:translateY(-2px);box-shadow:0 15px 35px rgba(255,193,7,.45);}
#loading{display:none;margin-top:15px;text-align:center;color:#FFC107;font-weight:600;}
@media(max-width:480px){.container{padding:15px;}.logo{width:150px;height:150px;}.logo-area h1{font-size:26px;}.card{padding:20px;}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo-area">
<img src="logo.png" class="logo" alt="Fixzy Logo">
<h1>Registrasi Akun</h1>
</div>
<form id="registerForm">
<div class="input-box"><label>Nama Konter</label><input type="text" id="namaKonter" placeholder="Masukkan nama konter" required></div>
<div class="input-box"><label>Nama Pemilik</label><input type="text" id="namaPemilik" placeholder="Masukkan nama pemilik" required></div>
<div class="input-box"><label>No WhatsApp</label><input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" maxlength="15" inputmode="numeric" required></div>
<div class="input-box"><label>Email</label><input type="email" id="email" placeholder="email@gmail.com" required></div>
<div class="input-box"><label>Alamat</label><textarea id="alamat" placeholder="Masukkan alamat lengkap"></textarea></div>
<div class="input-box"><label>Password</label><div class="password"><input type="password" id="password" placeholder="Minimal 8 karakter" required><button type="button" id="lihatPassword">👁</button></div></div>
<div class="input-box"><label>Konfirmasi Password</label><input type="password" id="konfirmasiPassword" placeholder="Ulangi password" required></div>
<div class="trial">🎁 Trial Gratis 3 Bulan - Langsung Aktif!</div>
<label class="check"><input type="checkbox" id="setuju" required><span>Saya menyetujui syarat dan ketentuan penggunaan aplikasi Fixzy.</span></label>
<button id="btnDaftar" type="submit">DAFTAR SEKARANG</button>
<div id="loading">Sedang membuat akun...</div>
<!-- FIX: Tombol login bawah sekarang langsung ke login.html -->
<div style="margin-top:20px;text-align:center;">Sudah punya akun? <a href="login.html" style="color:#FFC107;font-weight:bold;text-decoration:none;">Login</a></div>
</form>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyCwMbJsuORhIq4QCmp4c1r6OsjAUlfxU5Y",
authDomain: "fixzy-f056f.firebaseapp.com",
projectId: "fixzy-f056f",
storageBucket: "fixzy-f056f.firebasestorage.app",
messagingSenderId: "838081521031",
appId: "1:838081521031:web:50fdee909b56460b055f22"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const form = document.getElementById("registerForm");
const btn = document.getElementById("btnDaftar");
const loading = document.getElementById("loading");
const lihatPassword = document.getElementById("lihatPassword");
const passwordInput = document.getElementById("password");
lihatPassword.addEventListener("click",()=>{ passwordInput.type= passwordInput.type==="password" ? "text" : "password"; });
document.getElementById("whatsapp").addEventListener("input",function(){ this.value=this.value.replace(/[^0-9]/g,""); });
form.addEventListener("submit", async (e)=>{
e.preventDefault();
btn.disabled=true;
loading.style.display="block";
const namaKonter= document.getElementById("namaKonter").value.trim();
const namaPemilik= document.getElementById("namaPemilik").value.trim();
const whatsapp= document.getElementById("whatsapp").value.trim();
const email= document.getElementById("email").value.trim();
const alamat= document.getElementById("alamat").value.trim();
const password= document.getElementById("password").value;
const konfirmasi= document.getElementById("konfirmasiPassword").value;
if(password.length<8){ tampilPopup("Fixzy","Password minimal 8 karakter."); btn.disabled=false; loading.style.display="none"; return; }
if(whatsapp.length < 10){ tampilPopup("Fixzy","Nomor WhatsApp minimal 10 digit."); btn.disabled=false; loading.style.display="none"; return; }
if(password!==konfirmasi){ tampilPopup("Fixzy","Konfirmasi password tidak sama."); btn.disabled=false; loading.style.display="none"; return; }
if(namaKonter.length < 3){ tampilPopup("Fixzy","Nama konter minimal 3 karakter."); btn.disabled=false; loading.style.display="none"; return; }
if(namaPemilik.length < 3){ tampilPopup("Fixzy","Nama pemilik minimal 3 karakter."); btn.disabled=false; loading.style.display="none"; return; }
if(alamat.length < 5){ tampilPopup("Fixzy","Alamat minimal 5 karakter."); btn.disabled=false; loading.style.display="none"; return; }
if(!document.getElementById("setuju").checked){ tampilPopup("Fixzy","Silakan setujui syarat dan ketentuan."); btn.disabled=false; loading.style.display="none"; return; }
try{
const userCredential= await createUserWithEmailAndPassword(auth,email,password);
const uid=userCredential.user.uid;
const tanggalBerakhir=new Date();
tanggalBerakhir.setMonth(tanggalBerakhir.getMonth()+3);
await setDoc(doc(db,"users",uid),{
uid,
idKonter:"FX-"+Date.now(),
aplikasi:"Fixzy",
namaKonter,
namaPemilik,
whatsapp,
email,
alamat,
paket:"FREE TRIAL",
jenisLisensi:"Trial Gratis",
durasi:"3 Bulan",
harga:0,
status:"active",
statusPembayaran:"free",
masaAktif:"trial",
perpanjangan:false,
perpanjanganStatus:"none",
role:"user",
createdAt:serverTimestamp(),
tanggalDaftar:serverTimestamp(),
trialMulai:serverTimestamp(),
trialSelesai:tanggalBerakhir.toISOString(),
tanggalAktivasi:serverTimestamp(),
tanggalBerakhir:tanggalBerakhir.toISOString(),
device:navigator.userAgent,
versi:"Fixzy V1",
lastLogin:null
});
tampilPopup("Fixzy","Pendaftaran berhasil!\n\nTrial 3 Bulan kamu LANGSUNG AKTIF.\nSilakan login sekarang.");
// Setelah daftar berhasil, Firebase otomatis membuat sesi login.
// Logout dulu agar user masuk melalui login.html.
// Setelah login berhasil, login.html akan mengarahkan ke index.html (menu FIXZY asli).
setTimeout(async ()=>{
      try{
        await signOut(auth);
      }catch(e){
        console.warn("Logout setelah registrasi gagal:", e);
      }

      if(window.parent && window.parent!==window){
        window.parent.postMessage({type:"FIXZY_REGISTER_SUCCESS"},"*");
      }

      window.location.href="login.html";
    },1500);
}catch(err){
let pesan="Terjadi kesalahan.";
switch(err.code){
case "auth/email-already-in-use": pesan="Email sudah digunakan."; break;
case "auth/invalid-email": pesan="Format email tidak valid."; break;
case "auth/weak-password": pesan="Password terlalu lemah."; break;
default: pesan=err.message;
}
tampilPopup("Fixzy", pesan);
}finally{
btn.disabled=false;
loading.style.display="none";
}
});
function tampilPopup(judul,pesan){
  document.getElementById("popupJudul").innerText=judul;
  document.getElementById("popupPesan").innerText=pesan;
  document.getElementById("popup").style.display="flex";
}
function tutupPopup(){
  document.getElementById("popup").style.display="none";
}
window.tampilPopup=tampilPopup;
window.tutupPopup=tutupPopup;
</script>
<div id="popup" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:9999;">
  <div style="width:90%;max-width:340px;background:#1b1b1b;padding:25px;border-radius:20px;text-align:center;border:1px solid #FFC107;">
    <h3 id="popupJudul" style="color:#FFC107;">Fixzy</h3>
    <p id="popupPesan" style="margin:20px 0;color:#fff;white-space:pre-line;"></p>
    <button onclick="tutupPopup()" style="padding:12px 30px;border:none;border-radius:10px;background:#FFC107;color:#111;font-weight:bold;cursor:pointer;">OK</button>
  </div>
</div>
</body>
</html>
