<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fixzy | Registrasi Akun</title>
<meta name="theme-color" content="#FFC107">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
html{scroll-behavior:smooth}
body{background:#0d0d0d;background-image:radial-gradient(circle at top,rgba(255,193,7,.18),transparent 60%);color:#fff;min-height:100vh;overflow-x:hidden}
.container{width:100%;max-width:430px;margin:auto;padding:20px 15px 40px}
.card{background:#1b1b1b;border-radius:25px;padding:25px;border:1px solid rgba(255,193,7,.15);box-shadow:0 15px 35px rgba(0,0,0,.45)}
.logo-area{text-align:center;margin-bottom:25px}
.logo{width:170px;height:170px;object-fit:contain;padding:10px;border-radius:30px;background:#111;box-shadow:0 0 25px rgba(255,193,7,.35),0 0 60px rgba(255,193,7,.15);animation:logoGlow 2.5s infinite alternate}
@keyframes logoGlow{0%{transform:scale(1);box-shadow:0 0 20px rgba(255,193,7,.25)}100%{transform:scale(1.03);box-shadow:0 0 40px rgba(255,193,7,.5)}}
.logo-area h1{margin-top:18px;font-size:30px;font-weight:700;color:#FFC107}
.logo-area p{margin-top:8px;font-size:13px;color:#bdbdbd}
.input-box{margin-bottom:18px}
.input-box label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#FFC107}
.input-box input,.input-box textarea{width:100%;padding:14px;background:#252525;border:1px solid #333;border-radius:14px;font-size:15px;color:#fff;outline:none;transition:.25s}
.input-box textarea{resize:none;min-height:90px}
.input-box input:focus,.input-box textarea:focus{border-color:#FFC107;box-shadow:0 0 12px rgba(255,193,7,.25)}
.password{display:flex;align-items:center;background:#252525;border:1px solid #333;border-radius:14px;overflow:hidden}
.password input{border:none!important;background:transparent!important;box-shadow:none!important;margin:0}
.password button{width:55px;height:50px;border:none;background:#FFC107;color:#111;font-size:20px;cursor:pointer}
.token-box{margin:20px 0 12px;padding:14px;border-radius:14px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.25)}
.token-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.token-head label{margin:0!important}
.token-picker{position:relative}
#tokenAktivasi{cursor:pointer}
.token-picker-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:5000;max-height:250px;overflow-y:auto;background:#181818;border:1px solid #FFC107;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.55);padding:5px}
.token-picker-list.show{display:block}
.token-option{width:100%;display:block;text-align:left;border:0;border-bottom:1px solid #2b2b2b;background:#181818;color:#fff;padding:11px 12px;cursor:pointer;font-family:monospace;font-size:13px;font-weight:800}
.token-option:last-child{border-bottom:0}
.token-option:hover,.token-option:active{background:rgba(255,193,7,.16);color:#FFC107}
.token-option small{display:block;font-family:'Poppins',sans-serif;font-size:9px;font-weight:500;color:#8f8f8f;margin-top:3px}
.token-picker-empty{text-align:center;color:#aaa;font-size:11px;padding:18px 10px}
.token-picker-loading{text-align:center;color:#FFC107;font-size:11px;padding:18px 10px}
.token-help{font-size:10px;color:#aaa;line-height:1.5;margin-top:7px}
.check{display:flex;gap:10px;margin:18px 0;font-size:14px;color:#ddd}
.check input{margin-top:4px;transform:scale(1.15);accent-color:#FFC107}
#btnDaftar{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(90deg,#FFC107,#FF9800);color:#111;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(255,193,7,.30)}
#btnDaftar:disabled{opacity:.55;cursor:not-allowed}
#loading{display:none;margin-top:15px;text-align:center;color:#FFC107;font-weight:600}
.popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);justify-content:center;align-items:center;z-index:9999;padding:15px}
.popup-box{width:90%;max-width:340px;background:#1b1b1b;padding:25px;border-radius:20px;text-align:center;border:1px solid #FFC107}
.popup-box h3{color:#FFC107}
.popup-box p{margin:20px 0;color:#fff;white-space:pre-line;font-size:13px;line-height:1.6}
.popup-box button{padding:12px 30px;border:0;border-radius:10px;background:#FFC107;color:#111;font-weight:bold;cursor:pointer}
@media(max-width:480px){.container{padding:15px}.logo{width:150px;height:150px}.logo-area h1{font-size:26px}.card{padding:20px}}
</style>
</head>
<body>

<div class="container">
<div class="card">
<div class="logo-area">
<img src="logo.png" class="logo" alt="Fixzy Logo">
<h1>Registrasi Akun</h1>
<p>Aktivasi akun Fixzy dengan token 3 bulan</p>
</div>

<form id="registerForm">

<div class="input-box">
<label>Nama Konter</label>
<input type="text" id="namaKonter" placeholder="Masukkan nama konter" required>
</div>

<div class="input-box">
<label>Nama Pemilik</label>
<input type="text" id="namaPemilik" placeholder="Masukkan nama pemilik" required>
</div>

<div class="input-box">
<label>No WhatsApp</label>
<input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" maxlength="15" inputmode="numeric" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" placeholder="email@gmail.com" required>
</div>

<div class="input-box">
<label>Alamat</label>
<textarea id="alamat" placeholder="Masukkan alamat lengkap" required></textarea>
</div>

<div class="input-box">
<label>Password</label>
<div class="password">
<input type="password" id="password" placeholder="Minimal 8 karakter" required>
<button type="button" id="lihatPassword">👁</button>
</div>
</div>

<div class="input-box">
<label>Konfirmasi Password</label>
<input type="password" id="konfirmasiPassword" placeholder="Ulangi password" required>
</div>

<div class="token-box">
<div class="token-head">
<label>Token Registrasi 3 Bulan</label>
<span style="font-size:9px;color:#aaa">Pilih yang tersedia</span>
</div>

<div class="token-picker" id="tokenPicker">
<input type="text" id="tokenAktivasi" placeholder="Klik di sini untuk memilih token" autocomplete="off" required readonly>
<div id="tokenPickerList" class="token-picker-list" role="listbox"></div>
</div>

<div class="token-help">
Klik kolom token untuk menampilkan token registrasi yang belum terpakai. Daftar dapat di-scroll dan dicari.
</div>
</div>

<label class="check">
<input type="checkbox" id="setuju" required>
<span>Saya menyetujui syarat dan ketentuan penggunaan aplikasi Fixzy.</span>
</label>

<button id="btnDaftar" type="submit">DAFTAR SEKARANG</button>
<div id="loading">Sedang membuat akun...</div>

<div style="margin-top:20px;text-align:center">
Sudah punya akun?
<a href="login.html" style="color:#FFC107;font-weight:bold;text-decoration:none">Login</a>
</div>

</form>
</div>
</div>

<div id="popup" class="popup">
<div class="popup-box">
<h3 id="popupJudul">Fixzy</h3>
<p id="popupPesan"></p>
<button type="button" onclick="tutupPopup()">OK</button>
</div>
</div>

<script type="module">
import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 query,
 where,
 doc,
 setDoc,
 updateDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",
 authDomain:"fixzy-update.firebaseapp.com",
 projectId:"fixzy-update",
 storageBucket:"fixzy-update.firebasestorage.app",
 messagingSenderId:"995892519622",
 appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("registerForm");
const btn=document.getElementById("btnDaftar");
const loading=document.getElementById("loading");
const passwordInput=document.getElementById("password");
const tokenInput=document.getElementById("tokenAktivasi");
const tokenList=document.getElementById("tokenPickerList");
const tokenPicker=document.getElementById("tokenPicker");

let tokenData=[];
let tokenLoaded=false;
let tokenLoading=false;

document.getElementById("lihatPassword").addEventListener("click",()=>{
 passwordInput.type=passwordInput.type==="password"?"text":"password";
});

document.getElementById("whatsapp").addEventListener("input",function(){
 this.value=this.value.replace(/[^0-9]/g,"");
});

/* =========================================================
   TOKEN REGISTRASI
   COLLECTION: registerTokens
   HANYA:
   - 90 hari
   - belum dipakai
   ========================================================= */

async function loadAvailableTokens(force=false){

 if(tokenLoading)return;

 if(tokenLoaded && !force){
   renderTokenOptions();
   return;
 }

 tokenLoading=true;
 tokenList.innerHTML='<div class="token-picker-loading">Memuat token tersedia...</div>';

 try{

   /*
     SAMA SEPERTI PRODUK PENJUALAN:
     ambil data langsung dari Firebase lalu masukkan ke array.
     Token registrasi dibuat oleh halaman Admin di collection "tokens".
   */
   const snap=await getDocs(
     query(
       collection(db,"tokens"),
       where("tipe","==","aktivasi_baru")
     )
   );

   tokenData=[];

   snap.forEach(d=>{

     const x=d.data()||{};
     const token=String(x.token||"").trim();

     const used=
       x.used===true ||
       String(x.status||"").toLowerCase()==="terpakai";

     if(token && !used){

       tokenData.push({
         id:d.id,
         ...x,
         token:token,
         paketHari:Number(x.paketHari||90)
       });

     }

   });

   tokenData.sort((a,b)=>{

     const getDate=(x)=>{
       if(x?.toDate)return x.toDate();
       if(x?.seconds)return new Date(x.seconds*1000);
       return new Date(x||0);
     };

     return getDate(b.createdAt)-getDate(a.createdAt);

   });

   tokenLoaded=true;
   renderTokenOptions();

 }catch(err){

   console.error("LOAD REGISTER TOKENS:",err);

   tokenList.innerHTML=
     '<div class="token-picker-empty">'+
     'Gagal memuat token.<br>'+
     '<small>'+escapeHtml(err.message||String(err))+'</small>'+
     '</div>';

 }finally{

   tokenLoading=false;

 }

}

window.refreshRegistrationTokens=async function(){
 tokenLoaded=false;
 tokenData=[];
 await loadAvailableTokens(true);
};

function renderTokenOptions(){

 const keyword=(tokenInput.value||"").trim().toLowerCase();

 const filtered=tokenData.filter(t=>
   String(t.token||"").toLowerCase().includes(keyword)
 );

 if(!filtered.length){

   tokenList.innerHTML=
     '<div class="token-picker-empty">'+
     'Tidak ada token 3 bulan yang tersedia.'+
     '</div>';

   return;
 }

 tokenList.innerHTML=filtered.map(t=>{

   const token=escapeHtml(t.token);

   return `
   <button
     type="button"
     class="token-option"
     data-token="${token}"
     data-id="${escapeHtml(t.id)}"
   >
     ${token}
     <small>3 Bulan / 90 Hari · TERSEDIA</small>
   </button>
   `;

 }).join("");

 tokenList.querySelectorAll(".token-option").forEach(button=>{

   button.addEventListener("click",()=>{

     tokenInput.value=button.dataset.token||"";

     hideTokenList();

   });

 });

}

function showTokenList(){

 tokenList.classList.add("show");

 if(!tokenLoaded){
   loadAvailableTokens();
 }else{
   renderTokenOptions();
 }

}

function hideTokenList(){
 tokenList.classList.remove("show");
}

tokenInput.addEventListener("click",showTokenList);
tokenInput.addEventListener("focus",showTokenList);

document.addEventListener("click",(e)=>{
 if(!tokenPicker.contains(e.target)){
   hideTokenList();
 }
});

/* =========================================================
   REGISTER
   POLA DATA USERS MENGIKUTI REGISTER TRIAL LAMA.

   BEDANYA:
   - Trial lama: trial=true
   - Token baru: trial=false
   - Keduanya tetap role OWNER
   ========================================================= */

form.addEventListener("submit",async(e)=>{

 e.preventDefault();

 const namaKonter=document.getElementById("namaKonter").value.trim();
 const namaPemilik=document.getElementById("namaPemilik").value.trim();
 const whatsapp=document.getElementById("whatsapp").value.trim();
 const email=document.getElementById("email").value.trim();
 const alamat=document.getElementById("alamat").value.trim();
 const password=document.getElementById("password").value;
 const konfirmasi=document.getElementById("konfirmasiPassword").value;
 const tokenAktivasi=tokenInput.value.trim().toUpperCase();

 if(password.length<8)
   return tampilPopup("Fixzy","Password minimal 8 karakter.");

 if(whatsapp.length<10)
   return tampilPopup("Fixzy","Nomor WhatsApp minimal 10 digit.");

 if(password!==konfirmasi)
   return tampilPopup("Fixzy","Konfirmasi password tidak sama.");

 if(namaKonter.length<3)
   return tampilPopup("Fixzy","Nama konter minimal 3 karakter.");

 if(namaPemilik.length<3)
   return tampilPopup("Fixzy","Nama pemilik minimal 3 karakter.");

 if(alamat.length<5)
   return tampilPopup("Fixzy","Alamat minimal 5 karakter.");

 if(!document.getElementById("setuju").checked)
   return tampilPopup("Fixzy","Silakan setujui syarat dan ketentuan.");

 if(!tokenAktivasi)
   return tampilPopup("Fixzy","Pilih token registrasi terlebih dahulu.");

 btn.disabled=true;
 loading.style.display="block";

 let uid=null;
 let tokenId=null;

 try{

   /* -----------------------------------------------------
      1. CEK TOKEN LANGSUNG KE FIREBASE
      Supaya token tidak bisa dipakai dua kali.
      ----------------------------------------------------- */

   const tokenSnap=await getDocs(
     query(
       collection(db,"tokens"),
       where("token","==",tokenAktivasi)
     )
   );

   if(tokenSnap.empty){
     throw new Error("Token tidak ditemukan atau tidak valid.");
   }

   let tokenDoc=null;
   let tokenInfo=null;

   tokenSnap.forEach(d=>{
     if(!tokenDoc){
       tokenDoc=d;
       tokenInfo=d.data()||{};
     }
   });

   tokenId=tokenDoc.id;

   const sudahDipakai=
     tokenInfo.used===true ||
     String(tokenInfo.status||"").toLowerCase()==="terpakai";

   if(sudahDipakai){
     throw new Error("Token sudah pernah digunakan.");
   }

   const tokenTipe=String(tokenInfo.tipe||tokenInfo.jenis||"").toLowerCase();
   if(tokenTipe!=="aktivasi_baru"){
     throw new Error("Token ini bukan token registrasi pengguna baru.");
   }

   const paketHari=
     Number(tokenInfo.paketHari||0) ||
     Number(String(tokenInfo.paket||"").replace(/[^0-9]/g,"")) ||
     0;

   if(paketHari!==90){
     throw new Error("Token registrasi harus paket 3 bulan / 90 hari.");
   }

   /* -----------------------------------------------------
      2. BUAT AUTH
      ----------------------------------------------------- */

   const userCredential=
     await createUserWithEmailAndPassword(
       auth,
       email,
       password
     );

   uid=userCredential.user.uid;

   /* -----------------------------------------------------
      3. MASA AKTIF 90 HARI
      ----------------------------------------------------- */

   const tanggalAktivasi=new Date();

   const tanggalBerakhir=new Date(tanggalAktivasi);

   tanggalBerakhir.setDate(
     tanggalBerakhir.getDate()+90
   );

   /* -----------------------------------------------------
      4. SIMPAN USERS
      STRUKTUR DISELARASKAN DENGAN REGISTER TRIAL LAMA.

      ROLE = OWNER
      ----------------------------------------------------- */

   await setDoc(
     doc(db,"users",uid),
     {
       uid,

       idKonter:"FX-"+Date.now(),

       aplikasi:"Fixzy",

       namaKonter,
       namaPemilik,
       whatsapp,
       email,
       alamat,

       paket:"3 Bulan",
       jenisLisensi:"Aktivasi Token",
       durasi:"90 Hari",
       harga:0,

       status:"aktif",
       statusPembayaran:"free",

       masaAktif:"aktif",

       trial:false,

       perpanjangan:false,
       perpanjanganStatus:"none",

       role:"owner",
       ownerUid:uid,

       tokenAktivasi:tokenAktivasi,
       tokenType:"registrasi_baru",
       tokenId:tokenId,

       createdAt:serverTimestamp(),
       tanggalDaftar:serverTimestamp(),

       tanggalAktivasi:
         tanggalAktivasi.toISOString(),

       tanggalBerakhir:
         tanggalBerakhir.toISOString(),

       device:navigator.userAgent,

       versi:"Fixzy V1",

       lastLogin:null
     }
   );

   /* -----------------------------------------------------
      5. TANDAI TOKEN TERPAKAI
      ----------------------------------------------------- */

   await updateDoc(
     doc(db,"tokens",tokenId),
     {
       used:true,
       status:"terpakai",
       usedBy:uid,
       usedByEmail:email,
       usedAt:serverTimestamp()
     }
   );

   /* -----------------------------------------------------
      6. BERHASIL
      ----------------------------------------------------- */

   tampilPopup(
     "Fixzy",
     "Pendaftaran berhasil!\n\n"+
     "Akun OWNER aktif selama 90 hari.\n"+
     "Token registrasi sudah ditandai TERPAKAI.\n\n"+
     "Silakan login sekarang."
   );

   /*
     Register -> logout -> login
     Supaya login tetap menjadi pintu masuk normal.
   */

   setTimeout(async()=>{

     try{
       await signOut(auth);
     }catch(err){
       console.warn("SIGN OUT REGISTER:",err);
     }

     if(window.parent && window.parent!==window){

       window.parent.postMessage(
         {type:"FIXZY_REGISTER_SUCCESS"},
         "*"
       );

     }else{

       window.location.href="login.html";

     }

   },1500);

 }catch(err){

   console.error("REGISTER TOKEN ERROR:",err);

   let pesan="Terjadi kesalahan.";

   switch(err.code){

     case "auth/email-already-in-use":
       pesan="Email sudah digunakan.";
       break;

     case "auth/invalid-email":
       pesan="Format email tidak valid.";
       break;

     case "auth/weak-password":
       pesan="Password terlalu lemah.";
       break;

     case "permission-denied":
       pesan="Firebase menolak akses. Periksa Firestore Rules.";
       break;

     default:
       pesan=err.message||pesan;

   }

   /*
     Jika Auth sudah berhasil tetapi penulisan users gagal,
     jangan diam-diam membuat akun kedua.
   */
   if(uid){
     console.error(
       "AUTH SUDAH TERBUAT. UID:",
       uid,
       "TOKEN:",
       tokenId
     );
   }

   tampilPopup("Gagal Registrasi",pesan);

 }finally{

   btn.disabled=false;
   loading.style.display="none";

 }

});

/* =========================================================
   POPUP
   ========================================================= */

function tampilPopup(judul,pesan){

 document.getElementById("popupJudul").innerText=judul;
 document.getElementById("popupPesan").innerText=pesan;
 document.getElementById("popup").style.display="flex";

}

function tutupPopup(){

 document.getElementById("popup").style.display="none";

}

window.tampilPopup=tampilPopup;
window.tutupPopup=tutupPopup;

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

 return String(value??"").replace(
   /[&<>"']/g,
   char=>({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#39;"
   }[char])
 );

}
</script>

</body>
</html>
