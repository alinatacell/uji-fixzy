<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI", authDomain: "fixzy-update.firebaseapp.com", projectId: "fixzy-update", storageBucket: "fixzy-update.appspot.com", messagingSenderId: "431404655232", appId: "1:431404655232:web:5f7d9c9a1b2c3d4e5f6a7" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let allRows=[], filteredRows=[], currentDetail=null, pendingWA=null;
let konterName="FIXZY";

onAuthStateChanged(auth, async u=>{
  if(!u){ location.href="login.html"; return; }
  // Ambil nama konter terdaftar dari data register - coba beberapa sumber
  try{
    const { getDoc, doc, collection, query, where, getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    let found=false;
    // 1. Coba users/uid
    try{
      const d1 = await getDoc(doc(db,"users",u.uid));
      if(d1.exists()){
        const p=d1.data();
        konterName=p.namaKonter||p.konterName||p.namaToko||p.toko||p.konter||p.nama||p.name||p.konterNama||"";
        if(konterName && konterName!=="FIXZY") found=true;
      }
    }catch(e){}
    // 2. Cari by email di users
    if(!found){
      try{
        const snap = await getDocs(query(collection(db,"users"), where("email","==",u.email)));
        if(!snap.empty){
          const p=snap.docs[0].data();
          const k=p.namaKonter||p.konterName||p.namaToko||p.toko||p.konter||p.nama||p.name||p.konterNama||"";
          if(k){ konterName=k; found=true; }
        }
      }catch(e){}
    }
    // 3. Coba collection konter
    if(!found){
      try{
        const snap = await getDocs(query(collection(db,"konter"), where("email","==",u.email)));
        if(!snap.empty){
          const p=snap.docs[0].data();
          const k=p.namaKonter||p.konterName||p.namaToko||p.toko||p.nama||"";
          if(k){ konterName=k; found=true; }
        }
      }catch(e){}
    }
    // 4. Coba localStorage atau fallback
    if(!found || !konterName || konterName==="FIXZY"){
      // Cek apakah ada di penjualan pertama
      try{
        const snap = await getDocs(query(collection(db,"penjualan"), where("akunLogin","==",u.email)));
        if(!snap.empty){
          const p=snap.docs[0].data();
          const k=p.namaKonter||p.konter||"";
          if(k){ konterName=k; found=true; }
        }
      }catch(e){}
    }
    if(!konterName || konterName.trim()==="") konterName="FIXZY";
    console.log("Konter terdaftar:", konterName);
    // Update header tulisan FIXZY jadi nama konter dari register + Data penjualan di bawahnya
    try{
      const headerEl=document.getElementById('konterNameHeader');
      if(headerEl && konterName && konterName!=="FIXZY"){
        headerEl.textContent=konterName;
      }
    }catch(e){}

  }catch(e){ 
    console.log("Gagal ambil konter, pakai FIXZY", e);
    konterName="FIXZY"; 
  }
  await load();
});

function getKonterNameFromData(d){
  // Ambil dari data register yang ada di dokumen penjualan atau global
  return d.namaKonter||d.konter||d.namaToko||konterName||"FIXZY";
}

async function load(){
  try{
    const snap=await getDocs(collection(db,"penjualan"));
    allRows=snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>new Date(b.tanggal||b.createdAt?.seconds*1000||0)-new Date(a.tanggal||a.createdAt?.seconds*1000||0));
    // Jika konterName masih FIXZY, coba ambil dari data penjualan pertama (register)
    if((!konterName || konterName==="FIXZY") && allRows.length>0){
      const first=allRows[0];
      const k=first.namaKonter||first.konter||first.namaToko||"";
      if(k){
        konterName=k;
        const headerEl=document.getElementById('konterNameHeader');
        if(headerEl) headerEl.textContent=k;
        console.log("Konter dari penjualan:", k);
      }
    }
    render();
  }catch(e){
    console.error(e);
  }
}

function getTanggal(d){ return d.tanggal|| (d.createdAt?.seconds? new Date(d.createdAt.seconds*1000).toLocaleDateString('id-ID'):'-'); }
function getNota(d){ return d.nomorNota||d.nota||'-'; }
function getTeknisi(d){ return d.teknisiNama||d.teknisi||'-'; }
function getNamaPel(d){ return d.pelanggan?.nama||d.nama||'-'; }
function getWa(d){ return d.pelanggan?.wa||d.noHp||d.wa||'-'; }
function getAlamat(d){ return d.pelanggan?.alamat||d.alamat||'-'; }
function getItems(d){ return d.items||[]; }
function getTotal(d){ return Number(d.total||0); }
function getDiskon(d){ return Number(d.diskon||0); }
function getDp(d){ return Number(d.dp||0); }
function getSisa(d){ return Number(d.sisa ?? (getTotal(d)-getDiskon(d)-getDp(d))); }
function getModal(d){ const it=getItems(d); if(it.length>0) return it.reduce((s,x)=>s+Number(x.modal||0)*Number(x.qty||1),0); return Number(d.modal||0); }
function getPendapatan(d){ return getTotal(d)-getDiskon(d); }
function getLaba(d){ return getPendapatan(d)-getModal(d); }
function getStatus(d){ return (d.status||'masuk').toLowerCase(); }

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=document.getElementById('f').value;
  filteredRows=allRows.filter(d=>{ const st=getStatus(d); if(f!=='semua'&&st!==f) return false; if(!q) return true; const hay=`${getTanggal(d)} ${getTeknisi(d)} ${getNamaPel(d)} ${getWa(d)} ${getAlamat(d)} ${getNota(d)}`.toLowerCase(); return hay.includes(q); });

  // Ringkasan otomatis mengikuti data yang sedang tampil.
  // Batal tidak dihitung sebagai penghasilan.
  const summaryRows=filteredRows.filter(d=>getStatus(d)!=='batal');
  const summaryTotal=summaryRows.length;
  const summaryIncome=summaryRows.reduce((sum,d)=>sum+getPendapatan(d),0);
  const summaryEl=document.getElementById('salesSummary');
  if(summaryEl){
    summaryEl.innerHTML=`
      <span class="sum-icon">☁️</span>
      <span class="sum-title">Data <strong>penjualan</strong> • Total: <strong>${summaryTotal}</strong> • Penghasilan: <span class="sum-income">Rp ${summaryIncome.toLocaleString('id-ID')}</span></span>
    `;
  }

  document.getElementById('info').textContent=`${filteredRows.length} dari ${allRows.length} data - Excel tanggal teknisi nama WA alamat - Lihat untuk panel`;
  const tbody=document.getElementById('tbody'); tbody.innerHTML='';
  if(filteredRows.length===0){ tbody.innerHTML=`<tr><td colspan="8" style="padding:20px;text-align:center;color:#64748b">Belum ada data</td></tr>`; return; }
  filteredRows.forEach((d,i)=>{
    const st=getStatus(d),total=getTotal(d);
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><span style="background:#111827;color:#facc15;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:10px">${i+1}</span></td>
      <td><div style="font-weight:800;font-size:11px">${getTanggal(d)}</div><div style="font-size:10px;color:#64748b">${getNota(d)}</div><span class="badge ${st}">${st.toUpperCase()}</span></td>
      <td style="font-weight:700">${getTeknisi(d)}</td>
      <td style="font-weight:800">${getNamaPel(d)}</td>
      <td>${getWa(d)}</td>
      <td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${getAlamat(d)}">${getAlamat(d)}</td>
      <td style="text-align:right"><b>Rp ${total.toLocaleString('id-ID')}</b></td>
      <td style="text-align:center"><button class="btn-lihat" onclick="lihatPanel('${d.id}')"><i class="ri-eye-line"></i> Lihat</button></td>
    `;
    tbody.appendChild(tr);
  });
}

window.lihatPanel=(id)=>{
  const d=allRows.find(x=>x.id===id);
  if(!d) return;
  currentDetail=d;
  const st=getStatus(d),items=getItems(d),total=getTotal(d),diskon=getDiskon(d),dp=getDp(d),sisa=getSisa(d),modalVal=getModal(d),pendVal=getPendapatan(d),labaVal=getLaba(d);
  document.getElementById('modalTitle').textContent=`${getNota(d)} - ${getNamaPel(d)}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="section-title">TANGGAL & TEKNISI</div>
    <div class="info-grid">
      <div class="info"><div class="k">Tanggal</div><div class="v">${getTanggal(d)}</div></div>
      <div class="info"><div class="k">No Nota</div><div class="v">${getNota(d)}</div></div>
      <div class="info"><div class="k">Teknisi</div><div class="v">${getTeknisi(d)}</div></div>
      <div class="info"><div class="k">Status</div><div class="v"><span class="badge ${st}">${st.toUpperCase()}</span></div></div>
    </div>
    <div class="section-title">PELANGGAN</div>
    <div class="info-grid">
      <div class="info"><div class="k">Nama</div><div class="v" style="font-weight:900">${getNamaPel(d)}</div></div>
      <div class="info"><div class="k">WA</div><div class="v">${getWa(d)}</div></div>
      <div class="info" style="grid-column:1/-1"><div class="k">Alamat</div><div class="v">${getAlamat(d)}</div></div>
    </div>
    <div class="section-title">PEMBELIAN - Y20 X1 = HARGA</div>
    <div>

window.editData=(id)=>{localStorage.setItem('fixzy_edit_id',id);location.href=`input-penjualan.html?edit=${id}`;}

window.setStatus=async(id,st)=>{
  try{
    const d=allRows.find(x=>x.id===id);
    await updateDoc(doc(db,"penjualan",id),{status:st,updatedAt:new Date().toISOString()});
    // JANGAN TUTUP PANEL - biar pengguna yang tutup
    // Update allRows
    if(d) d.status=st;
    render();
    // Jika panel sedang terbuka, update badge di modal juga
    if(currentDetail && currentDetail.id===id){
      currentDetail.status=st;
      const badgeInModal=document.querySelector('#modalBody .badge');
      if(badgeInModal){
        badgeInModal.className=`badge ${st}`;
        badgeInModal.textContent=st.toUpperCase();
      }
      // Tampilkan popup WA jika tagihan atau tunai
      if(st==='tagihan' || st==='tunai'){
        showWAPopup(d, st);
      }
    } else {
      // Jika ganti dari tabel langsung
      if(st==='tagihan' || st==='tunai'){
        const target=allRows.find(x=>x.id===id);
        if(target) showWAPopup(target, st);
      }
    }
  }catch(e){ console.error(e); }
}

function showWAPopup(data, status){
  pendingWA={data, status};
  const nama=getNamaPel(data);
  const wa=getWa(data);
  const nota=getNota(data);
  const total=getTotal(data);
  const alamat=getAlamat(data);
  const sisa=getSisa(data);
  const items=getItems(data);
  const barang=items.length>0?items.map(i=>i.nama).join(', '):'Y20';
  const konterReal=getKonterNameFromData(data);
  let msg='';
  if(status==='tagihan'){
    msg=`Halo Kak ${nama} 🙏

Saya dari *${konterReal}*,
Mau infokan tagihan:

📄 Nota: ${nota}
📦 Barang: ${barang}
💰 Total: Rp ${total.toLocaleString('id-ID')}
💳 Sisa Tagihan: Rp ${sisa.toLocaleString('id-ID')}
📍 Alamat: ${alamat}

Mohon segera diselesaikan ya Kak. Bisa transfer atau datang langsung ke konter.

Terima kasih 🙏
*${konterReal}*`;
  } else {
    msg=`Halo Kak ${nama} 🙏

Terima kasih sudah berbelanja di *${konterReal}* 🤝

📄 Nota: ${nota}
📦 Barang: ${barang}
💰 Total: Rp ${total.toLocaleString('id-ID')} - *LUNAS / TUNAI* ✅
📍 Alamat: ${alamat}

Barang sudah LUNAS dan bisa diambil kapan saja ya Kak. Ditunggu kedatangannya!

Terima kasih 🙏
*${konterReal}* - Melayani dengan Amanah`;
  }
  document.getElementById('waMessage').textContent=msg;
  document.getElementById('waInfo').textContent=`Akan dikirim ke WA pelanggan: ${nama} (${wa}) - ${konterReal}`;
  document.getElementById('waModal').classList.add('show');
  // Simpan konterReal untuk dipakai saat kirim
  pendingWA.konterReal=konterReal;
}

window.closeWAModal=()=>{ document.getElementById('waModal').classList.remove('show'); pendingWA=null; }

window.sendWA=()=>{
  try{
    if(!pendingWA || !pendingWA.data){
      console.error('Data WA tidak ada');
      return;
    }

    const data=pendingWA.data;
    let waRaw=(getWa(data)||'').toString().trim();
    let waDigits=waRaw.replace(/[^0-9]/g,'');

    if(!waDigits || waDigits.length<10){
      console.error('No WA pelanggan tidak valid:', waRaw);
      return;
    }

    let waNumber=waDigits;
    if(waNumber.startsWith('0')){
      waNumber='62'+waNumber.substring(1);
    }else if(!waNumber.startsWith('62')){
      waNumber='62'+waNumber;
    }

    const msgEl=document.getElementById('waMessage');
    const msg=msgEl ? msgEl.textContent.trim() : '';

    if(!msg){
      console.error('Pesan WA kosong');
      return;
    }

    const waUrl='https://wa.me/'+waNumber+'?text='+encodeURIComponent(msg);

    // Buka WA sebagai TAB BARU dari klik tombol langsung.
    // Jangan pindahkan halaman FIXZY ke wa.me.
    // Interceptor di bawah juga sudah dibuat melewati link WhatsApp.
    const a=document.createElement('a');
    a.href=waUrl;
    a.target='_blank';
    a.rel='noopener noreferrer';
    a.style.position='fixed';
    a.style.left='-9999px';
    a.style.top='-9999px';
    document.body.appendChild(a);

    // Klik langsung dalam event tombol pengguna.
    a.click();

    setTimeout(()=>{
      try{ a.remove(); }catch(e){}
    },1000);

    closeWAModal();

  }catch(err){
    console.error('Gagal buka WA:', err);
  }
}

// Pengiriman WA menggunakan sendWA() di atas.

<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht if(/^(https?:\/\/)?(wa\.me|api\.whatsapp\.com|web\.whatsapp\.com)\b/i.test(dataHref.href))return;if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
